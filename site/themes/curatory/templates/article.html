<!doctype html>
<html lang="zh-Hant" data-api-base="{{.APIBase}}" class="{{if .DarkMode}}dark{{end}}">
<head>
{{template "doc-head" .}}
</head>
<body class="flex min-h-screen flex-col bg-background text-foreground antialiased">
{{template "chrome-top" .}}

<main class="flex-1">
  <article class="mx-auto w-full max-w-3xl px-4 py-10 sm:px-6 sm:py-14 lg:px-8">
    <a href="/news/" class="inline-flex items-center gap-2 rounded-full px-2 py-1 text-sm text-muted-foreground transition-colors hover:text-foreground">
      <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      回公告列表
    </a>

    <header class="mt-6" data-reveal>
      <div class="flex flex-wrap items-center gap-2.5">
        <span class="rounded-full border border-primary/25 px-3 py-1 text-[11px] font-normal text-primary">公告</span>
        {{if .Article.Pinned}}
        <span class="inline-flex items-center gap-1 rounded-full bg-gold/15 px-3 py-1 text-[11px] font-normal text-gold">
          <svg class="size-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
          置頂
        </span>
        {{end}}
        <span class="flex items-center gap-1.5 text-xs text-muted-foreground">
          <svg class="size-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <time>{{dateLabel .Article.PublishedAt}}</time>
        </span>
      </div>
      <h1 class="mt-4 font-serif text-2xl font-semibold leading-snug sm:text-4xl">{{.Article.Title}}</h1>
    </header>

    <div class="prose-curatory mt-7 border-t pt-7 text-[15px] leading-[1.95] text-foreground/90" data-reveal data-reveal-delay="0.08">
      {{.Body}}
    </div>

    <footer class="mt-10 flex justify-between gap-4 border-t pt-6">
      <a href="/news/" class="inline-flex h-11 items-center gap-2 rounded-full border px-6 text-sm transition-colors hover:bg-muted">
        <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        回公告列表
      </a>
      <a href="/shop/" class="inline-flex h-11 items-center rounded-full bg-primary px-6 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90">
        順道逛逛商店
      </a>
    </footer>
  </article>
</main>

{{template "chrome-bottom" .}}
</body>
</html>
