<!doctype html>
<html lang="zh-Hant" data-api-base="{{.APIBase}}" class="{{if .DarkMode}}dark{{end}}">
<head>
{{template "doc-head" .}}
</head>
<body class="flex min-h-screen flex-col bg-background text-foreground antialiased">
{{template "chrome-top" .}}

<main class="flex-1">
  <article class="mx-auto w-full max-w-3xl px-4 py-10 sm:px-6 sm:py-14 lg:px-8">
    <nav class="text-xs text-muted-foreground" aria-label="麵包屑">
      <a href="/" class="link-underline transition-colors hover:text-foreground">首頁</a>
      <span class="mx-2">/</span>
      <span>{{.Title}}</span>
    </nav>
    <header class="mt-6" data-reveal>
      <h1 class="font-serif text-3xl font-semibold leading-snug tracking-wide sm:text-4xl">{{.Title}}</h1>
    </header>
    <div class="mt-8 space-y-4 border-t pt-8 text-[15px] leading-[1.95] text-foreground/90" data-reveal data-reveal-delay="0.08">
      {{.Body}}
    </div>
  </article>
</main>

{{template "chrome-bottom" .}}
</body>
</html>
