<!doctype html>
<html lang="zh-Hant" data-api-base="{{.APIBase}}" class="{{if .DarkMode}}dark{{end}}">
<head>
{{template "doc-head" .}}
</head>
<body class="flex min-h-screen flex-col bg-background text-foreground antialiased">
{{template "chrome-top" .}}

<main class="flex-1">
  {{/* OrderPage 島：訂單確認/明細。從 ?id=<orderId> 讀單號，
       access token 取自本機 recent orders（結帳後自動寫入）。 */}}
  <div data-vue-island="OrderPage">
    <div class="mx-auto w-full max-w-3xl px-4 py-16 text-center sm:px-6">
      <p class="eyebrow">Order</p>
      <h1 class="mt-3 font-serif text-2xl font-semibold tracking-wide sm:text-3xl">訂單明細</h1>
      <p class="mt-4 text-sm text-muted-foreground">載入訂單中…</p>
      <noscript>
        <p class="mt-6 rounded-lg border border-dashed px-4 py-3 text-sm text-muted-foreground">訂單查詢需要啟用 JavaScript。</p>
      </noscript>
    </div>
  </div>
</main>

{{template "chrome-bottom" .}}
</body>
</html>
