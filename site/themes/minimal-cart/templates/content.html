<!doctype html>
<html lang="zh-Hant" data-api-base="{{.APIBase}}" class="{{if .DarkMode}}dark{{end}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}} — {{.SiteName}}</title>
  <meta name="description" content="{{.Title}}">
  <link rel="canonical" href="{{.PublicSiteURL}}/content/{{.Key}}">
  <link rel="stylesheet" href="/assets/islands/islands-{{.IslandsCSSHash}}.css">
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <div data-vue-island="AnnouncementBar"></div>
  <div data-vue-island="Header"></div>

  <main class="mx-auto max-w-3xl px-4 py-12 sm:px-6 lg:px-8">
    <h1 class="text-2xl font-semibold tracking-tight">{{.Title}}</h1>
    <div class="mt-6 prose prose-stone max-w-none">{{.Body}}</div>
  </main>

  <nav id="footer-static" class="border-t border-border/60 bg-muted/20 px-4 py-8 sm:px-6 lg:px-8" aria-label="Information and policies">
    <div class="mx-auto max-w-7xl">
      <h2 class="text-xs font-medium uppercase tracking-wider text-muted-foreground">Information and policies</h2>
      {{if gt (len .FooterContent) 0}}
      <ul class="mt-4 flex flex-wrap gap-x-6 gap-y-2">
        {{range .FooterContent}}
        <li><a href="{{if $.PublicSiteURL}}{{$.PublicSiteURL}}{{end}}/content/{{.Key}}/" class="text-sm text-foreground/80 transition-colors hover:text-foreground">{{.Title}}</a></li>
        {{end}}
      </ul>
      {{else}}
      <p class="mt-4 text-xs text-muted-foreground">Information will be published before launch.</p>
      {{end}}
    </div>
  </nav>

  <div data-vue-island="Footer"></div>

  <div data-vue-island="CartDrawer"></div>
  <div data-vue-island="AccountDialog"></div>
  <div data-vue-island="TrackOrderDialog"></div>
  <div data-vue-island="CheckoutDialog"></div>
  <div data-vue-island="FooterPageDialog"></div>
  <div data-vue-island="ProductDetailDialog"></div>
  <div data-vue-island="WelcomePopup"></div>
  <div data-vue-island="Toaster"></div>

  <script type="module" src="/assets/islands/islands.js"></script>
</body>
</html>
