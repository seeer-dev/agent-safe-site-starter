<!doctype html>
<html lang="zh-Hant" data-api-base="{{.APIBase}}" class="{{if .DarkMode}}dark{{end}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Article.Title}} · {{.SiteName}}</title>
  <meta name="description" content="{{.Article.Excerpt}}">
  <link rel="canonical" href="{{.PublicSiteURL}}/articles/{{.Article.Slug}}/">
  <link rel="stylesheet" href="/assets/islands/islands-{{.IslandsCSSHash}}.css">
</head>
<body class="min-h-screen bg-background text-foreground antialiased">
  <!-- Island: AnnouncementBar -->
  <div data-vue-island="AnnouncementBar"></div>

  <!-- Island: Header -->
  <div data-vue-island="Header"></div>

  <main class="mx-auto max-w-3xl px-4 py-16 sm:px-6 lg:px-8">
    <p class="mb-4">
      <a href="/" class="text-sm text-muted-foreground transition-colors hover:text-foreground">← 回首頁</a>
    </p>
    <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">{{.Article.Title}}</h1>
    <p class="mt-3 text-lg text-muted-foreground">{{.Article.Excerpt}}</p>
    <div class="prose mt-8 max-w-none text-foreground/90">{{.Body}}</div>
  </main>

  <!-- Island: Footer -->
  <div data-vue-island="Footer"></div>

  <!-- Islands: Dialogs (always present, invisible until opened) -->
  <div data-vue-island="CartDrawer"></div>
  <div data-vue-island="AccountDialog"></div>
  <div data-vue-island="TrackOrderDialog"></div>
  <div data-vue-island="CheckoutDialog"></div>
  <div data-vue-island="FooterPageDialog"></div>
  <div data-vue-island="ProductDetailDialog"></div>
  <div data-vue-island="Toaster"></div>

  <script type="module" src="/assets/islands/islands.js"></script>
</body>
</html>
