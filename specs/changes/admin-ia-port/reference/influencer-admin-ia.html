  articles:[{title:'夏季保濕 5 大迷思破解',category:'保養知識',status:'published',views:12400,date:'2026/07/01',author:'林淑芬',summary:'很多人以為夏天只要控油就好，其實冷氣房才是水分殺手…',body:'炎炎夏日，許多人把保養重點放在控油，卻忽略了「缺水」才是肌膚出油的真正元兇。\n\n## 5 大常見迷思\n\n1. **夏天不需要保濕** —— 冷氣房濕度常低於 40%，比冬天還乾。\n2. **出油就要去油** —— 越洗越乾，肌膚反而分泌更多油脂代償。\n3. **面膜天天敷** —— 過度水合會破壞角質屏障。\n4. **只擦化妝水就夠** —— 沒有鎖水（乳液/乳霜），水分蒸發更快。\n5. **SPF 越高越好** —— 係數高不代表防護時間長，補擦才是關鍵。\n\n## 建議的夏季保養順序\n\n清潔 → 化妝水 → 精華液（玻尿酸） → 乳液 → 防曬',tags:['保濕','夏季']},{title:'網紅聯名款開箱實測',category:'商品開箱',status:'published',views:28600,date:'2026/06/20',author:'陳冠廷',summary:'與 Aura 質感生活聯名的保濕乳液，實測 14 天…',body:'這次與 Aura 質感生活聯名的保濕乳液，主打神經醯胺 + 角鯊烷雙重修護。\n\n## 質地\n偏乳霜狀但不厚重，推開後吸收速度中等，大約 30 秒。\n\n## 保濕持久度\n使用皮膚水分測試儀：\n- 使用前：32%\n- 使用後 1 小時：48%\n- 使用後 8 小時：41%\n\n## 總評\n質地適合中性／乾性肌，油性肌夏季可能偏潤。聯名包裝質感佳，送禮合適。',tags:['聯名','開箱']},{title:'父親節送禮指南',category:'節日企劃',status:'draft',views:0,date:'2026/07/05',author:'陳冠廷',summary:'8/8 父親節將至，男士理容保養推薦清單…',body:'（草稿，待補完）',tags:['男士','節日']}],

function $(s){return document.querySelector(s);}function $$(s){return document.querySelectorAll(s);}function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}function icon(n,c='h-4 w-4'){return `<i data-lucide="${n}" class="${c}"></i>`;}function money(n){return n==null?'—':'NT$ '+n.toLocaleString('zh-TW');}function refreshIcons(){if(window.lucide)window.lucide.createIcons();}

/* ============================================================ TOAST / 確認框 ============================================================ */
function toast(msg,type='success',opts={}){const ic={success:'check-circle',error:'x-circle',info:'info',warning:'alert-triangle'};const cl={success:'border-brand-200 dark:border-brand-500/30',error:'border-red-200 dark:border-red-500/30',info:'border-blue-200 dark:border-blue-500/30',warning:'border-amber-200 dark:border-amber-500/30'};const icl={success:'text-brand-600 dark:text-brand-400',error:'text-red-600 dark:text-red-400',info:'text-blue-600 dark:text-blue-400',warning:'text-amber-600 dark:text-amber-400'};const t=el('div',`anim-toast flex items-start gap-3 rounded-lg border bg-card pl-3 pr-4 py-3 shadow-lg ${cl[type]} min-w-[300px] max-w-md`);t.innerHTML=`${icon(ic[type]+' '+icl[type],'h-5 w-5 shrink-0 mt-0.5')}<div class="flex-1 text-sm"><div class="font-medium">${msg}</div>${opts.detail?`<div class="mt-0.5 text-xs text-muted-foreground">${opts.detail}</div>`:''}</div>`;$('#toastContainer').appendChild(t);refreshIcons();setTimeout(()=>{t.style.transition='opacity .3s, transform .3s';t.style.opacity='0';t.style.transform='translateY(10px)';setTimeout(()=>t.remove(),300);},opts.duration||3500);}
function confirmDialog({title,message,detail,confirmLabel='確認',danger=true,onConfirm}){const ov=$('#confirmOverlay');ov.hidden=false;ov.className='anim-fade fixed inset-0 z-[75] flex items-center justify-center bg-black/40 p-4';ov.innerHTML=`<div class="anim-scale w-full max-w-sm rounded-xl border border-border bg-card p-5 shadow-xl"><div class="mb-2 flex items-center gap-2">${danger?`<div class="flex h-8 w-8 items-center justify-center rounded-full bg-red-100 dark:bg-red-500/15">${icon('alert-triangle','h-4 w-4 text-red-600 dark:text-red-400')}</div>`:''}<h3 class="text-base font-semibold">${title}</h3></div><p class="mb-1 text-sm text-muted-foreground">${message}</p>${detail?`<p class="mb-4 rounded-md bg-surface-50 p-2.5 text-xs text-muted-foreground dark:bg-surface-100">${detail}</p>`:'<div class="mb-4"></div>'}<div class="flex justify-end gap-2"><button class="cancel-btn inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-[13px] font-medium text-surface-600 hover:bg-surface-100 dark:text-surface-400 dark:hover:bg-surface-200">取消</button><button class="ok-btn inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-[13px] font-medium ${danger?'bg-destructive text-white hover:opacity-90':'bg-brand-600 text-white hover:bg-brand-700'}">${confirmLabel}</button></div></div>`;refreshIcons();const close=()=>{ov.hidden=true;ov.innerHTML='';};ov.querySelector('.cancel-btn').addEventListener('click',close);ov.querySelector('.ok-btn').addEventListener('click',()=>{close();onConfirm&&onConfirm();});ov.addEventListener('click',e=>{if(e.target===ov)close();},{once:true});}

/* 圖片上傳處理（demo：讀成 data URL 顯示預覽） */
function handleImgUpload(key,input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{const prev=document.getElementById('imgPreview-'+key);if(prev){prev.innerHTML=`<img src="${e.target.result}" class="h-full w-full rounded-lg object-cover">`;}const txt=document.querySelector(`[name="${key}"]`);if(txt)txt.value='[uploaded]';toast('圖片已上傳','success',{detail:file.name,duration:2000});};reader.readAsDataURL(file);}

/* ============================================================ 表單 Modal ============================================================ */
function formDialog({title,subtitle,fields,values,confirmLabel='儲存',onSave,size='md',allowFullscreen=false}){const ov=$('#formOverlay');ov.hidden=false;ov.className='anim-fade fixed inset-0 z-[78] flex items-center justify-center bg-black/40 p-4';const V=values||{};const rf=f=>{const val=V[f.key]??f.default??'';if(f.type==='switch')return `<label class="flex items-center justify-between rounded-md border border-border px-3 py-2"><div><div class="text-sm font-medium">${f.label}${f.required?' <span class="text-destructive">*</span>':''}</div>${f.help?`<div class="text-xs text-muted-foreground">${f.help}</div>`:''}</div><button type="button" class="switch-toggle relative h-6 w-11 rounded-full transition-colors ${val?'bg-brand-600':'bg-surface-300 dark:bg-surface-600'}" data-key="${f.key}"><span class="absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform ${val?'translate-x-[22px]':'translate-x-0.5'}"></span></button></label>`;if(f.type==='select')return `<div><label class="mb-1 block text-sm font-medium">${f.label}${f.required?' <span class="text-destructive">*</span>':''}</label><select name="${f.key}" class="w-full rounded-md border border-input bg-background px-3 py-2 text-sm">${f.options.map(o=>`<option value="${o.value??o}" ${(o.value??o)==val?'selected':''}>${o.label??o}</option>`).join('')}</select></div>`;if(f.type==='textarea')return `<div><label class="mb-1 block text-sm font-medium">${f.label}${f.required?' <span class="text-destructive">*</span>':''}</label><textarea name="${f.key}" rows="${f.rows||3}" class="w-full rounded-md border border-input bg-background px-3 py-2 text-sm" placeholder="${f.placeholder||''}">${val}</textarea></div>`;
  if(f.type==='image'){const emoji=val||'📦';return `<div><label class="mb-1 block text-sm font-medium">${f.label}</label><div class="flex items-center gap-3"><div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-lg border-2 border-dashed border-input bg-surface-50 text-3xl dark:bg-surface-100" id="imgPreview-${f.key}">${emoji}</div><div class="flex-1 space-y-1.5"><button type="button" onclick="document.getElementById('file-${f.key}').click()" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-card px-2.5 py-1.5 text-xs font-medium text-surface-700 hover:bg-surface-100 dark:text-surface-300 dark:hover:bg-surface-200"><i data-lucide="upload" class="h-3.5 w-3.5"></i>上傳圖片</button><input type="file" id="file-${f.key}" accept="image/*" class="hidden" onchange="handleImgUpload('${f.key}',this)"><div class="flex items-center gap-1"><span class="text-[11px] text-muted-foreground">或選 emoji：</span><input type="text" name="${f.key}" value="${val||''}" maxlength="4" class="w-14 rounded border border-input bg-background px-2 py-1 text-sm text-center" placeholder="🧴" oninput="document.getElementById('imgPreview-${f.key}').textContent=this.value||'📦'"></div></div></div></div>`;}return `<div><label class="mb-1 block text-sm font-medium">${f.label}${f.required?' <span class="text-destructive">*</span>':''}</label><input type="${f.type||'text'}" name="${f.key}" value="${val}" ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.step?`step="${f.step}"`:''} class="w-full rounded-md border border-input bg-background px-3 py-2 text-sm" placeholder="${f.placeholder||''}"></div>`;};const sizeCls={sm:'max-w-md',md:'max-w-lg',lg:'max-w-2xl',xl:'max-w-4xl'};ov.innerHTML=`<div id="formModal" class="anim-scale w-full ${sizeCls[size]||sizeCls.md} max-h-[90vh] overflow-y-auto scrollbar-thin rounded-xl border border-border bg-card shadow-xl"><header class="sticky top-0 flex items-center justify-between gap-2 border-b border-border bg-card px-5 py-4"><div class="min-w-0"><h3 class="text-base font-semibold">${title}</h3>${subtitle?`<p class="mt-0.5 truncate text-xs text-muted-foreground">${subtitle}</p>`:''}</div><div class="flex shrink-0 items-center gap-1">${allowFullscreen?`<button id="fsToggle" class="rounded-md p-1 text-muted-foreground hover:bg-muted" title="全螢幕">${icon('maximize-2','h-4 w-4')}</button>`:''}<button class="close-btn rounded-md p-1 text-muted-foreground hover:bg-muted">${icon('x','h-5 w-5')}</button></div></header><form id="formContent" class="space-y-4 p-5">${fields.map(rf).join('')}</form><footer class="sticky bottom-0 flex justify-end gap-2 border-t border-border bg-card px-5 py-3"><button class="cancel-btn inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-[13px] font-medium text-surface-600 hover:bg-surface-100 dark:text-surface-400 dark:hover:bg-surface-200">取消</button><button class="save-btn inline-flex items-center gap-1.5 rounded-md bg-brand-600 px-3 py-1.5 text-[13px] font-medium text-white hover:bg-brand-700">${icon('save','h-4 w-4')}<span class="save-label">${confirmLabel}</span></button></footer></div>`;refreshIcons();const close=()=>{ov.hidden=true;ov.innerHTML='';};ov.querySelector('.close-btn').addEventListener('click',close);ov.querySelector('.cancel-btn').addEventListener('click',close);ov.addEventListener('click',e=>{if(e.target===ov)close();},{once:true});if(allowFullscreen){const modal=$('#formModal');const fsBtn=$('#fsToggle');let fs=false;fsBtn.addEventListener('click',()=>{fs=!fs;const normCls=(sizeCls[size]||sizeCls.md)+' max-h-[90vh] overflow-y-auto scrollbar-thin rounded-xl border border-border bg-card shadow-xl';modal.className=fs?'anim-scale w-full max-w-none h-screen max-h-none rounded-none overflow-y-auto scrollbar-thin border border-border bg-card shadow-xl':'anim-scale w-full '+normCls;ov.className=fs?'anim-fade fixed inset-0 z-[78] bg-card':'anim-fade fixed inset-0 z-[78] flex items-center justify-center bg-black/40 p-4';fsBtn.innerHTML=icon(fs?'minimize-2':'maximize-2','h-4 w-4');refreshIcons();});}ov.querySelectorAll('.switch-toggle').forEach(b=>b.addEventListener('click',()=>{const on=!b.classList.contains('bg-brand-600');b.classList.toggle('bg-brand-600',on);b.classList.toggle('bg-surface-300',!on);b.classList.toggle('dark:bg-surface-600',!on);b.querySelector('span').className=`absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform ${on?'translate-x-[22px]':'translate-x-0.5'}`;}));ov.querySelector('.save-btn').addEventListener('click',()=>{const form=$('#formContent');const data={};fields.forEach(f=>{if(f.type==='switch'){const b=ov.querySelector(`[data-key="${f.key}"]`);data[f.key]=b.classList.contains('bg-brand-600');}else{const e2=form.querySelector(`[name="${f.key}"]`);data[f.key]=f.type==='number'?Number(e2.value):e2.value;}});const btn=ov.querySelector('.save-btn');const label=btn.querySelector('.save-label');btn.disabled=true;btn.classList.add('opacity-70','cursor-wait');label.innerHTML=`<span class="inline-block h-3.5 w-3.5 animate-spin rounded-full border-2 border-white/40 border-t-white"></span> 儲存中…`;setTimeout(()=>{close();onSave&&onSave(data);},700);});}

/* ============================================================ 指令面板 ============================================================ */
function openCmdK(){closeCmdK();const ov=$('#cmdkOverlay');ov.hidden=false;ov.className='anim-fade fixed inset-0 z-[85] flex items-start justify-center pt-[15vh]';ov.innerHTML=`<div class="absolute inset-0 bg-black/30" onclick="closeCmdK()"></div><div class="anim-scale relative w-full max-w-lg rounded-xl border border-border bg-card shadow-2xl"><div class="flex items-center gap-2 border-b border-border px-4 py-3">${icon('search','h-4 w-4 text-muted-foreground')}<input id="cmdkInput" class="flex-1 bg-transparent text-sm outline-none placeholder:text-muted-foreground" placeholder="搜尋頁面或執行動作…" autocomplete="off"><kbd class="rounded border border-border bg-surface-100 px-1.5 text-[10px] dark:bg-surface-200">ESC</kbd></div><div id="cmdkResults" class="max-h-[50vh] overflow-y-auto scrollbar-thin p-2"></div></div>`;const input=$('#cmdkInput');input.focus();input.addEventListener('input',()=>renderCmdKResults(input.value));input.addEventListener('keydown',e=>{if(e.key==='Escape')closeCmdK();if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();navCmdK(e.key==='ArrowDown'?1:-1);}if(e.key==='Enter'){const s=$$('#cmdkResults [data-cmdk-item]')[cmdkActiveIdx];if(s)s.click();}});renderCmdKResults('');refreshIcons();}
let cmdkActiveIdx=0;function closeCmdK(){const ov=$('#cmdkOverlay');ov.hidden=true;ov.innerHTML='';cmdkActiveIdx=0;}function navCmdK(d){const items=$$('#cmdkResults [data-cmdk-item]');if(!items.length)return;items.forEach(i=>i.classList.remove('bg-brand-50','dark:bg-brand-500/10'));cmdkActiveIdx=(cmdkActiveIdx+d+items.length)%items.length;items[cmdkActiveIdx].classList.add('bg-brand-50','dark:bg-brand-500/10');items[cmdkActiveIdx].scrollIntoView({block:'nearest'});}
function renderCmdKResults(q){q=q.toLowerCase().trim();const navItems=VISIBLE_LEAVES.filter(i=>!q||i.label.toLowerCase().includes(q));const actions=[{label:'新增商品',icon:'plus-circle',route:'products'},{label:'建立檔期',icon:'calendar-plus',route:'campaigns'},{label:'新增網紅',icon:'user-plus',route:'influencers'},{label:'新增員工',icon:'user-plus',route:'staff'},{label:'測試寄信',icon:'send',route:'notif-test'}];const mA=actions.filter(a=>!q||a.label.toLowerCase().includes(q));let html='';if(navItems.length){html+=`<div class="mb-1 px-2 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">頁面</div>`;html+=navItems.map(i=>`<button data-cmdk-item class="flex w-full items-center gap-2.5 rounded-md px-2.5 py-2 text-left text-sm hover:bg-brand-50 dark:hover:bg-brand-500/10" onclick="closeCmdK();navigate('${i.id}')">${icon(i.icon||'circle','h-4 w-4 text-muted-foreground')}<span class="flex-1">${i.label}</span></button>`).join('');}if(mA.length){html+=`<div class="mb-1 px-2 pt-3 pb-1 text-[10px] font-semibold uppercase tracking-wide text-muted-foreground">動作</div>`;html+=mA.map(a=>`<button data-cmdk-item class="flex w-full items-center gap-2.5 rounded-md px-2.5 py-2 text-left text-sm hover:bg-brand-50 dark:hover:bg-brand-500/10" onclick="closeCmdK();navigate('${a.route}')">${icon(a.icon,'h-4 w-4 text-brand-600 dark:text-brand-400')}<span class="flex-1">${a.label}</span></button>`).join('');}if(!html)html=`<div class="px-3 py-6 text-center text-sm text-muted-foreground">沒有符合的結果</div>`;$('#cmdkResults').innerHTML=html;cmdkActiveIdx=0;const first=$('#cmdkResults [data-cmdk-item]');if(first)first.classList.add('bg-brand-50','dark:bg-brand-500/10');}

/* ============================================================ 多選篩選器 ============================================================ */
function multiSelectFilter({id,label,options,selectedSet,onChangeFn='onMSFChange',clearFn='clearMSF'}){
  const count=selectedSet.size;
  return `<div class="relative" data-msf="${id}">
    <button onclick="toggleMSF('${id}')" class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-1.5 text-xs font-medium transition-colors ${count>0?'border-brand-500 bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300':'border-border bg-card text-muted-foreground hover:bg-surface-100 dark:hover:bg-surface-200'}">
      ${icon('filter','h-3.5 w-3.5')}${label}${count>0?`<span class="flex h-4 min-w-4 items-center justify-center rounded-full bg-brand-600 px-1 text-[10px] text-white">${count}</span>`:''}${icon('chevron-down','h-3 w-3')}
    </button>
    <div id="msf-${id}" class="anim-slide-down absolute left-0 top-full z-40 mt-1 hidden w-56 rounded-lg border border-border bg-card p-1.5 shadow-xl">
      <div class="mb-1 flex items-center justify-between px-2"><span class="text-[11px] font-semibold uppercase text-muted-foreground">${label}</span><button onclick="${clearFn}('${id}')" class="text-[11px] text-muted-foreground hover:text-foreground">清除</button></div>
      <div class="max-h-56 overflow-y-auto scrollbar-thin">
        ${options.map(o=>{const v=o.value??o;const lbl=o.label??o;const checked=selectedSet.has(v);return `<label class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-1.5 text-sm hover:bg-surface-100 dark:hover:bg-surface-200"><input type="checkbox" class="msf-cb rounded" data-msf-id="${id}" value="${v}" ${checked?'checked':''} onchange="${onChangeFn}('${id}',this)"><span class="flex-1">${lbl}</span></label>`;}).join('')}
      </div>
    </div>
  </div>`;
}
function toggleMSF(id){const panel=$(`#msf-${id}`);const isOpen=!panel.hidden;$$('[id^="msf-"]').forEach(p=>p.hidden=true);panel.hidden=isOpen;}
function onMSFChange(id,cb){const set=id==='msfCampaign'?orderFilters.campaign:id==='msfInf'?orderFilters.influencer:orderFilters.status;if(cb.checked)set.add(cb.value);else set.delete(cb.value);navigate('all-orders');}
function clearMSF(id){const set=id==='msfCampaign'?orderFilters.campaign:id==='msfInf'?orderFilters.influencer:orderFilters.status;set.clear();navigate('all-orders');}
// 點外部關閉
document.addEventListener('click',e=>{if(!e.target.closest('[data-msf]'))$$('[id^="msf-"]').forEach(p=>p.hidden=true);});

/* ============================================================ Sidebar ============================================================ */
function renderNav(){const nav=$('#nav');nav.innerHTML='';const c=sidebarCollapsed;nav.classList.toggle('px-2',!c);nav.classList.toggle('px-1',c);nav.classList.toggle('space-y-0.5',!c);nav.classList.toggle('space-y-1',c);IA.forEach(item=>{if(item.isDivider){if(c){const d=el('div','flex justify-center py-2');d.innerHTML=`<div class="h-px w-6 bg-sidebar-border"></div>`;nav.appendChild(d);}else{const d=el('div','px-3 pt-4 pb-1');d.innerHTML=`<span class="text-[10px] font-semibold uppercase tracking-wider text-muted-foreground/70">${item.label}</span>`;nav.appendChild(d);}return;}if(!item.children){nav.appendChild(c?makeCollapsedItem(item):makeLeafNav(item));return;}if(c){const wrap=el('div','group relative');const btn=el('button',`relative flex w-full items-center justify-center rounded-md py-2 transition-colors ${isCatActive(item)?'bg-sidebar-accent text-brand-600 dark:text-brand-400':'text-muted-foreground hover:bg-sidebar-accent/50'}`);btn.innerHTML=icon(item.icon,'h-5 w-5');btn.title=item.label;const fly=el('div','flyout hidden group-hover:block');fly.innerHTML=`<div class="anim-slide-down rounded-lg border border-border bg-card p-1.5 shadow-xl"><div class="px-2 py-1 text-[11px] font-semibold text-muted-foreground">${item.label}</div>${item.children.map(ch=>`<button class="flex w-full items-center gap-2 rounded-md px-2.5 py-1.5 text-left text-[13px] ${currentRoute===ch.id?'bg-brand-50 text-brand-700 dark:bg-brand-500/15 dark:text-brand-300 font-medium':'text-surface-700 hover:bg-surface-100 dark:text-surface-300 dark:hover:bg-surface-200'}" onclick="navigate('${ch.id}')"><span class="flex-1 whitespace-nowrap">${ch.label}</span></button>`).join('')}</div>`;wrap.appendChild(btn);wrap.appendChild(fly);nav.appendChild(wrap);}else{const wrap=el('div');const expanded=expandedCats.has(item.id);const catBtn=el('button',`group flex w-full items-center gap-2.5 rounded-md px-3 py-1.5 text-left text-[13px] font-medium transition-colors ${isCatActive(item)?'text-brand-700 dark:text-brand-300':'text-surface-700 dark:text-surface-300'} hover:bg-sidebar-accent/50`);catBtn.innerHTML=`${icon(item.icon,`h-4 w-4 shrink-0 ${isCatActive(item)?'text-brand-600 dark:text-brand-400':'text-muted-foreground'}`)}<span class="flex-1 truncate">${item.label}</span>${item.badge?`<span class="text-xs">${item.badge}</span>`:''}${icon('chevron-right',`h-3.5 w-3.5 shrink-0 text-muted-foreground transition-transform ${expanded?'rotate-90':''}`)}`;catBtn.addEventListener('click',()=>{if(expandedCats.has(item.id))expandedCats.delete(item.id);else expandedCats.add(item.id);saveExpanded();renderNav();});wrap.appendChild(catBtn);if(expanded){const cw=el('div','anim-fade mt-0.5 mb-1 ml-[14px] border-l border-sidebar-border pl-1 space-y-px');item.children.forEach(ch=>{const active=currentRoute===ch.id;const cb=el('button',`group/sub flex w-full items-center gap-2 rounded-md py-1.5 pl-2.5 pr-2 text-left text-[13px] transition-all min-h-[32px] ${active?'font-medium text-brand-700 bg-brand-50 dark:text-brand-300 dark:bg-brand-500/15':'text-surface-600 hover:text-surface-800 hover:bg-surface-100 dark:text-surface-400 dark:hover:bg-surface-200'}`);let badge='';if(ch.badge)badge+=`<span class="rounded bg-brand-600 px-1 py-0.5 text-[9px] font-bold text-white">${ch.badge}</span>`;if(ch.danger)badge+=`<span class="text-amber-500">${icon('alert-triangle','h-3 w-3')}</span>`;cb.innerHTML=`<span class="flex-1 truncate">${ch.label}</span>${badge}`;cb.addEventListener('click',()=>navigate(ch.id));cw.appendChild(cb);});wrap.appendChild(cw);}nav.appendChild(wrap);}});refreshIcons();}
function isCatActive(cat){return cat.children&&cat.children.some(c=>c.id===currentRoute);}
function makeLeafNav(item){const active=currentRoute===item.id;const a=el('button','group relative flex w-full items-center gap-2.5 rounded-md px-3 py-1.5 text-left text-[13px] transition-colors');if(active){a.classList.add('bg-sidebar-accent','text-sidebar-accent-foreground','font-medium');a.innerHTML+=`<span class="nav-active-bar"></span>`;}else a.classList.add('text-sidebar-foreground/80','hover:bg-sidebar-accent/50');a.innerHTML+=`${icon(item.icon,`h-4 w-4 shrink-0 ${active?'text-brand-600 dark:text-brand-400':'text-muted-foreground'}`)}<span class="flex-1 truncate">${item.label}</span>`;a.addEventListener('click',()=>navigate(item.id));return a;}
function makeCollapsedItem(item){const active=currentRoute===item.id;const wrap=el('div','group relative');const btn=el('button',`relative flex w-full items-center justify-center rounded-md py-2 transition-colors ${active?'bg-brand-50 text-brand-600 dark:bg-brand-500/15 dark:text-brand-400':'text-muted-foreground hover:bg-sidebar-accent/50'}`);btn.innerHTML=icon(item.icon,'h-5 w-5');btn.title=item.label;if(active)btn.innerHTML+=`<span class="absolute left-0 top-1/2 -translate-y-1/2 h-5 w-0.5 rounded-r bg-brand-500"></span>`;const fly=el('div','flyout hidden group-hover:block');fly.innerHTML=`<div class="anim-slide-down rounded-lg border border-border bg-card px-3 py-1.5 text-[13px] font-medium shadow-xl whitespace-nowrap ${active?'text-brand-700 dark:text-brand-300':'text-surface-700 dark:text-surface-300'}">${item.label}</div>`;wrap.appendChild(btn);wrap.appendChild(fly);btn.addEventListener('click',()=>navigate(item.id));return wrap;}
function toggleCollapse(){sidebarCollapsed=!sidebarCollapsed;localStorage.setItem('ia.sidebarCollapsed',sidebarCollapsed);applySidebarState();renderNav();}
function applySidebarState(){

/* 列操作（上下移、編輯、刪除、隱藏）— 用於有序列的表格 */
// custom actions: [{icon,label,onclick,tone}] —— tone: brand|amber|blue|danger|ghost
function rowActions({onUp,onDown,onEdit,onDelete,onHide,hidden=false,custom=[]}){
  const toneCls={brand:'hover:text-brand-600',amber:'hover:text-amber-600',blue:'hover:text-blue-600',danger:'hover:text-destructive',ghost:'hover:text-foreground'};
  const iconBtn=({icon:i,label,onclick,tone='ghost'})=>`<button onclick="${onclick||''}" class="rounded p-1 text-muted-foreground hover:bg-surface-100 dark:hover:bg-surface-200 ${toneCls[tone]||''}" title="${label}">${icon(i,'h-3.5 w-3.5')}</button>`;
  return `<div class="flex items-center gap-0.5">
    ${onUp?iconBtn({icon:'arrow-up',label:'上移',onclick:onUp}):''}
    ${onDown?iconBtn({icon:'arrow-down',label:'下移',onclick:onDown}):''}
    ${custom.map(iconBtn).join('')}
    ${onEdit?iconBtn({icon:'pencil',label:'編輯',onclick:onEdit,tone:'brand'}):''}
    ${onDelete?iconBtn({icon:'trash-2',label:'刪除',onclick:onDelete,tone:'danger'}):''}
    ${onHide!=null?iconBtn({icon:hidden?'eye-off':'eye',label:hidden?'顯示':'隱藏',onclick:onHide}):''}
  </div>`;
}

/* ============================================================ Charts (pure CSS/SVG) ============================================================ */
function barChart(data,opts={}){
  const max=Math.max(...data.map(d=>d.amt));
  const w=opts.width||100; const barW=`${100/data.length}%`;
  const bars=data.map(d=>{
    const h=Math.round(d.amt/max*100);
    const isLast=d===data[data.length-1];
    return `<div class="group relative flex flex-1 flex-col items-center justify-end" style="height:100%"><div class="absolute -top-7 left-1/2 hidden -translate-x-1/2 whitespace-nowrap rounded-md bg-surface-900 px-2 py-1 text-[10px] text-white group-hover:block dark:bg-surface-700 z-10">NT$ ${(d.amt*10000).toLocaleString()}</div><div class="vbar w-full max-w-[24px] rounded-t ${isLast?'bg-brand-500':'bg-brand-300/70 dark:bg-brand-500/40'} group-hover:bg-brand-600 transition-colors" style="height:${h}%"></div></div>`;
  }).join('');
  const labels=data.map((d,i)=>i%2===0?`<span class="flex-1 text-center text-[9px] text-muted-foreground">${d.date.slice(5)}</span>`:'').join('');
  return `<div class="flex h-40 items-end gap-0.5 px-1">${bars}</div><div class="mt-1.5 flex">${labels}</div>`;
}
function donutChart(data){
  const total=data.reduce((s,d)=>s+d.value,0);
  let acc=0;const R=60;const C=2*Math.PI*R;
  const segs=data.map(d=>{const pct=d.value/total;const len=pct*C;const off=-acc*C;acc+=pct;return `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${d.color}" stroke-width="24" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${off}" transform="rotate(-90 80 80)" class="bar-grow"/>`;}).join('');
  return `<svg width="160" height="160" viewBox="0 0 160 160">${segs}<text x="80" y="76" text-anchor="middle" class="fill-surface-900 dark:fill-surface-50 text-xl font-semibold">${total}</text><text x="80" y="94" text-anchor="middle" class="fill-surface-500 text-[10px]">總訂單</text></svg>`;
}
function hBarRow({label,value,max,color='#1a6e4a',suffix='',sublabel=''}){
  const pct=Math.round(value/max*100);
  return `<div class="flex items-center gap-3 py-1.5"><div class="w-28 shrink-0 truncate text-xs font-medium">${label}</div><div class="flex-1"><div class="h-5 overflow-hidden rounded bg-surface-100 dark:bg-surface-200"><div class="bar-grow flex h-full items-center justify-end rounded px-1.5 text-[10px] font-medium text-white" style="width:${Math.max(pct,8)}%;background:${color}">${value}${suffix}</div></div>${sublabel?`<div class="mt-0.5 text-[10px] text-muted-foreground">${sublabel}</div>`:''}</div></div>`;
}

let infSort={col:'totalSales',dir:'desc'};
function renderInfluencers(){
  const w=el('div');

  const fb=el('div','mb-3 flex flex-wrap items-center gap-2');

  w.appendChild(fb);
  const filtered=getFilteredInfluencers();
  const sh=(label,col)=>{const active=infSort.col===col;return `<th class="whitespace-nowrap px-4 py-2.5 text-left align-middle text-[11px] font-semibold uppercase tracking-wide text-muted-foreground"><button onclick="setInfSort('${col}')" class="inline-flex items-center gap-1 hover:text-foreground ${active?'text-brand-600 dark:text-brand-400':''}">${label}${active?icon(infSort.dir==='asc'?'chevron-up':'chevron-down','h-3 w-3'):icon('chevrons-up-down','h-3 w-3 opacity-30')}</button></th>`;};

  w.insertAdjacentHTML('beforeend',bulkBar([{label:'啟用',icon:'check'},{label:'暫停',icon:'pause'},{label:'匯出',icon:'download'}]));
  setTimeout(wireBulk,0);
  return w;
}
function getFilteredInfluencers(){return MOCK.influencers.filter(i=>{if(infFilters.status.size&&!infFilters.status.has(i.status))return false;return true;}).sort((a,b)=>{const dir=infSort.dir==='asc'?1:-1;let va=a[infSort.col],vb=b[infSort.col];if(infSort.col==='convRate'){va=parseFloat(a.convRate);vb=parseFloat(b.convRate);}if(typeof va==='string')return va.localeCompare(vb,'zh-TW')*dir;return(va-vb)*dir;});}
function setInfSort(col){if(infSort.col===col)infSort.dir=infSort.dir==='asc'?'desc':'asc';else{infSort.col=col;infSort.dir='desc';}navigate('influencers');}
function onInfMSFChange(id,cb){if(cb.checked)infFilters.status.add(cb.value);else infFilters.status.delete(cb.value);navigate('influencers');}

t><dd class="text-xs">${i.bank}</dd></div><div class="flex justify-between"><dt class="text-muted-foreground">合作起始</dt><dd class="text-xs">${i.joinedAt}</dd></div></dl>`,footerHtml:`<div class="flex gap-2"><button onclick="closeDrawer();openInfluencerForm('${i.id}')" class="inline-flex items-center gap-1.5 rounded-md bg-brand-600 px-3 py-1.5 text-[13px] font-medium text-white hover:bg-brand-700">${icon('edit','h-4 w-4')}編輯資料</button><button onclick="closeDrawer();navigate('attributed')" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-card px-3 py-1.5 text-[13px] font-medium text-surface-700 hover:bg-surface-100 dark:text-surface-300 dark:hover:bg-surface-200">${icon('target','h-4 w-4')}查看帶貨明細</button></div>`});}

  // 網紅報表 chart + 表格
  const maxOrders=Math.max(...c.members.map(m=>m.orders),1);
  const chartData=c.members.filter(m=>m.orders>0).map(m=>({amt:m.orders,label:m.influencer}));

    card('p-4 lg:col-span-2',`<div class="mb-3"><h2 class="text-sm font-semibold">網紅訂單分佈</h2><p class="text-xs text-muted-foreground">各網紅帶來的訂單數</p></div>${hBarChart(chartData,{suffix:' 單'})}`)+

// 水平條狀圖（給 campaign detail 用）
function hBarChart(data,{suffix='',color='#1a6e4a'}={}){
  if(!data.length)return '<div class="py-6 text-center text-sm text-muted-foreground">尚無資料</div>';
  const max=Math.max(...data.map(d=>d.amt),1);
  return `<div class="space-y-1.5">${data.map(d=>{const pct=Math.round(d.amt/max*100);return `<div class="flex items-center gap-3"><div class="w-28 shrink-0 truncate text-xs font-medium">${d.label}</div><div class="h-5 flex-1 overflow-hidden rounded bg-surface-100 dark:bg-surface-200"><div class="bar-grow flex h-full items-center justify-end rounded px-1.5 text-[10px] font-medium text-white" style="width:${Math.max(pct,8)}%;background:${color}">${d.amt}${suffix}</div></div></div>`;}).join('')}</div>`;
}

function toggleFulfillMenu(id){const m=$('#ff-menu-'+id);if(!m)return;$$('[id^="ff-menu-"]').forEach(x=>{if(x.id!=='ff-menu-'+id)x.hidden=true;});m.hidden=!m.hidden;}
function setFulfillStage(id,stage){
  const o=MOCK.orders.find(x=>x.id===id);if(!o)return;
  if(stage==='cancelled'){confirmDialog({title:'取消訂單？',message:`確定要取消 ${o.id}？`,detail:`${o.customer} · ${money(o.total)}`,confirmLabel:'確認取消',onConfirm:()=>{o.status='cancelled';o.fulfillStage='cancelled';toast('訂單已取消','warning',{detail:o.id});navigate('fulfillment');}});return;}
  if(stage==='shipped'){confirmDialog({title:'確認交物流？',message:`訂單 ${o.id} 將標記為已出貨。`,confirmLabel:'確認出貨',danger:false,onConfirm:()=>{o.status='shipped';o.fulfillStage='shipped';toast('已交物流','success',{detail:o.id+' · 已出貨'});navigate('fulfillment');}});return;}

function renderRoles(){const w=el('div');w.innerHTML=pageHeader('角色權限','依功能模組設定角色權限矩陣',`<button onclick="openRoleForm()" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-card px-3 py-1.5 text-[13px] font-medium text-surface-700 hover:bg-surface-100 dark:text-surface-300 dark:hover:bg-surface-200">${icon('plus','h-4 w-4')}新增角色</button>`);w.innerHTML+=`<div class="mb-4 flex flex-wrap items-center gap-3"><div class="flex items-center gap-2"><span class="text-xs font-medium text-muted-foreground">編輯中</span><select id="roleSelector" class="rounded-md border border-input bg-background px-2.5 py-1.5 text-sm font-medium">${MOCK.permRoles.map(r=>`<option value="${r.key}">${r.label}</option>`).join('')}</select></div><div class="h-5 w-px bg-border"></div><div class="flex items-center gap-2"><span class="text-xs font-medium text-muted-foreground">套用範本</span><select id="templateSelector" class="rounded-md border border-input bg-background px-2.5 py-1.5 text-sm">${MOCK.permTemplates.map(t=>`<option value="${t.key}">${t.label}</option>`).join('')}</select><button id="applyTemplate" class="inline-flex items-center gap-1.5 rounded-md border border-border bg-card px-2.5 py-1.5 text-xs font-medium text-surface-700 hover:bg-surface-100 dark:text-surface-300 dark:hover:bg-surface-200">${icon('copy','h-3.5 w-3.5')}套用</button></div><div class="flex-1"></div><button id="savePerms" class="inline-flex items-center gap-1.5 rounded-md bg-brand-600 px-3 py-1.5 text-[13px] font-medium text-white hover:bg-brand-700">${icon('save','h-4 w-4')}儲存變更</button></div>`;const mx=el('div','overflow-x-auto scrollbar-thin rounded-lg border border-border bg-card');const lg=el('div','mt-4 flex items-center gap-4 text-xs text-muted-foreground');const pv=el('div','mt-4 rounded-lg border border-brand-200 bg-brand-50/50 p-4 dark:border-brand-500/30 dark:bg-brand-500/5');const renderMatrix=()=>{const ar=$('#roleSelector')?.value||'super_admin';let html=`<table class="w-full text-sm"><thead><tr><th class="sticky left-0 z-10 bg-card px-4 py-2.5 text-left text-[11px] font-semibold uppercase text-muted-foreground">模組 ＼ 角色</th>`;MOCK.permRoles.forEach(r=>{html+=`<th class="px-2 py-2.5 text-center text-[11px] font-semibold uppercase ${r.key===ar?'text-brand-600 dark:text-brand-400':'text-muted-foreground'}">${r.label}</th>`;});html+=`</tr></thead><tbody>`;MOCK.permModules.forEach(mod=>{html+=`<tr class="border-t border-border hover:bg-surface-50 dark:hover:bg-surface-100/30"><td class="sticky left-0 z-10 bg-card px-4 py-2.5"><div class="flex items-center gap-2">${icon(mod.icon,'h-4 w-4 text-muted-foreground')}<span class="text-sm font-medium">${mod.label}</span></div></td>`;MOCK.permRoles.forEach(r=>{const lvl=MOCK.permMatrix[r.key][mod.key];const ld=MOCK.permLevels.find(l=>l.key===lvl);const act=r.key===ar;html+=`<td class="px-2 py-2 text-center"><button class="perm-cell inline-flex items-center justify-center rounded-md px-2 py-1 text-[11px] font-medium transition-all ${ld.cls} ${act?'ring-2 ring-brand-300 dark:ring-brand-500/40 cursor-pointer hover:scale-105':'opacity-60 cursor-default'}" data-role="${r.key}" data-mod="${mod.key}" data-lvl="${lvl}" ${act?'':'disabled'} title="${r.label} → ${mod.label}: ${ld.label}">${ld.abbr}</button></td>`;});html+=`</tr>`;});html+=`</tbody></table>`;mx.innerHTML=html;mx.querySelectorAll('.perm-cell').forEach(cell=>{if(cell.hasAttribute('disabled'))return;cell.addEventListener('click',()=>{const role=cell.dataset.role,mod=cell.dataset.mod;const ci=MOCK.permLevels.findIndex(l=>l.key===cell.dataset.lvl);const nl=MOCK.permLevels[(ci+1)%MOCK.permLevels.length];MOCK.permMatrix[role][mod]=nl.key;toast(`${MOCK.permRoles.find(r=>r.key===role).label} · ${MOCK.permModules.find(m=>m.key===mod).label} → ${nl.label}`,'info',{duration:2000});renderMatrix();updatePreview();});});refreshIcons();};lg.innerHTML=`<span class="font-medium text-surface-700 dark:text-surface-300">等級：</span>${MOCK.permLevels.map(l=>`<span class="inline-flex items-center gap-1"><span class="inline-flex h-5 w-5 items-center justify-center rounded ${l.cls} text-[10px] font-bold">${l.abbr}</span>${l.label}</span>`).join('')}<span class="ml-auto text-muted-foreground">點擊當前角色的儲存格循環切換等級</span>`;const updatePreview=()=>{const ar=$('#roleSelector')?.value||'super_admin';const rd=MOCK.permRoles.find(r=>r.key===ar);const pm=MOCK.permMatrix[ar];const sum=MOCK.permModules.map(m=>({mod:m,lvl:MOCK.permLevels.find(l=>l.key===pm[m.key])}));pv.innerHTML=`<div class="flex items-center gap-2 mb-2"><span class="text-xs font-semibold text-brand-700 dark:text-brand-300">即時預覽</span><span class="text-sm font-medium">${rd.label}</span><span class="text-xs text-muted-foreground">${rd.desc}</span></div><div class="flex flex-wrap gap-1.5">${sum.map(s=>`<span class="inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-[11px] font-medium ${s.lvl.cls}">${icon(s.mod.icon,'h-3 w-3')}${s.mod.label}: ${s.lvl.label}</span>`).join('')}</div>`;refreshIcons();};w.appendChild(mx);w.appendChild(lg);w.appendChild(pv);setTimeout(()=>{renderMatrix();updatePreview();$('#roleSelector').addEventListener('change',()=>{renderMatrix();updatePreview();});$('#applyTemplate').addEventListener('click',()=>{const tk=$('#templateSelector').value;const ar=$('#roleSelector').value;confirmDialog({title:`套用「${MOCK.permRoles.find(r=>r.key===tk).label}」範本？`,message:`這會覆寫 ${MOCK.permRoles.find(r=>r.key===ar).label} 目前所有模組的權限設定。`,confirmLabel:'套用',danger:false,onConfirm:()=>{MOCK.permMatrix[ar]={...MOCK.permMatrix[tk]};toast('權限範本已套用','success',{detail:`${MOCK.permRoles.find(r=>r.key===ar).label} ← ${MOCK.permRoles.find(r=>r.key===tk).label}`});renderMatrix();updatePreview();}});});$('#savePerms').addEventListener('click',()=>{const b=$('#savePerms');b.disabled=true;b.classList.add('opacity-70','cursor-wait');b.innerHTML=`<span class="inline-block h-3.5 w-3.5 animate-spin rounded-full border-2 border-white/40 border-t-white"></span> 儲存中…`;setTimeout(()=>{toast('權限設定已儲存','success',{detail:'所有角色變更已套用'});navigate('roles');},700);});},0);return w;}

/* ============================================================ 操作紀錄 / 設定 ============================================================ */
function openRoleForm(){
  formDialog({title:'新增角色',subtitle:'建立新角色並設定初始權限',fields:[
    {key:'key',label:'角色 Key（英文識別碼）',required:true,placeholder:'editor'},
    {key:'label',label:'角色名稱',required:true,placeholder:'內容編輯'},
    {key:'desc',label:'角色說明',type:'textarea',rows:2,placeholder:'負責內容撰寫與發布'},
    {key:'template',label:'從範本複製權限',type:'select',options:[{value:'',label:'— 空白（全部無權限）—'},...MOCK.permTemplates.map(t=>({value:t.key,label:t.label}))]},
  ],onSave:(data)=>{
    if(!data.key||!data.label){toast('角色 Key 和名稱為必填','error');return;}
    const newKey=data.key.trim().toLowerCase().replace(/\s+/g,'_');
    if(MOCK.permRoles.some(r=>r.key===newKey)){toast('此 Key 已存在','error');return;}
    const templatePerms=data.template?{...MOCK.permMatrix[data.template]}:{};
    MOCK.permModules.forEach(m=>{if(!templatePerms[m.key])templatePerms[m.key]='none';});
    MOCK.permRoles.push({key:newKey,label:data.label,desc:data.desc||''});
    MOCK.permMatrix[newKey]=templatePerms;
    MOCK.permTemplates.push({key:newKey,label:data.label+' 範本'});
    toast('角色已新增','success',{detail:data.label+'（可至矩陣調整權限）'});
    setTimeout(()=>{const sel=$('#roleSelector');if(sel)sel.value=newKey;navigate('roles');},100);
  }});
}

function renderAudits(){
  const w=el('div');
  w.innerHTML=pageHeader('操作紀錄','站點操作歷史與明細',btn('匯出','outline','download'));
  const cOpts=['訂單','網紅','商品','分潤'];
  const aOpts=[...new Set(MOCK.audits.map(a=>a.action))];
  const uOpts=[...new Set(MOCK.audits.map(a=>a.actor))];
  const fb=el('div','mb-3 flex flex-wrap items-center gap-2');
  fb.innerHTML=
    multiSelectFilter({id:'msfAuditCat',label:'分類',options:cOpts,selectedSet:auditFilters.category,onChangeFn:'onAuditMSFChange',clearFn:'clearAuditMSF'})+
    multiSelectFilter({id:'msfAuditAction',label:'動作類型',options:aOpts,selectedSet:auditFilters.action,onChangeFn:'onAuditMSFChange',clearFn:'clearAuditMSF'})+
    multiSelectFilter({id:'msfAuditActor',label:'操作者',options:uOpts,selectedSet:auditFilters.actor,onChangeFn:'onAuditMSFChange',clearFn:'clearAuditMSF'})+
    `<button onclick="toggleAuditSort()" class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-1.5 text-xs font-medium border-border bg-card text-muted-foreground hover:bg-surface-100 dark:hover:bg-surface-200" title="切換排序">${icon(auditSort==='desc'?'arrow-down-narrow-wide':'arrow-up-narrow-wide','h-3.5 w-3.5')}時間${auditSort==='desc'?'新→舊':'舊→新'}</button>`+
    `<div class="ml-auto text-xs text-muted-foreground">${getFilteredAudits().length} / ${MOCK.audits.length} 筆</div>`;
  w.appendChild(fb);
  const filtered=getFilteredAudits();
  if(!filtered.length){w.appendChild(el('div','',emptyState('search-x','沒有符合的紀錄','試著調整篩選條件')));return w;}
  // 按大分類分組
  const catIcon={訂單:'package',網紅:'users',商品:'boxes',分潤:'coins'};
  const catColor={訂單:'text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-500/15',網紅:'text-violet-600 dark:text-violet-400 bg-violet-50 dark:bg-violet-500/15',商品:'text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-500/15',分潤:'text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/15'};
  const groups={};
  filtered.forEach(a=>{(groups[a.category]=groups[a.category]||[]).push(a);});
  const order=['訂單','網紅','商品','分潤'];
  order.forEach(cat=>{
    if(!groups[cat]||!groups[cat].length)return;
    w.insertAdjacentHTML('beforeend',`<div class="mb-4"><div class="mb-2 flex items-center gap-2"><div class="flex h-6 w-6 items-center justify-center rounded-md ${catColor[cat]}">${icon(catIcon[cat],'h-3.5 w-3.5')}</div><h3 class="text-sm font-semibold">${cat}</h3><span class="text-xs text-muted-foreground">${groups[cat].length} 筆</span></div>${card('overflow-hidden',table(['時間','操作者','動作','對象','明細'],groups[cat].map(a=>`<td class="px-4 py-2.5 text-xs text-muted-foreground whitespace-nowrap">${a.time}</td><td class="px-4 py-2.5 font-medium">${a.actor}</td><td class="px-4 py-2.5"><span class="rounded bg-surface-100 px-1.5 py-0.5 text-xs dark:bg-surface-200">${a.action}</span></td><td class="px-4 py-2.5 font-mono text-xs text-brand-700 dark:text-brand-400">${a.target}</td><td class="px-4 py-2.5 text-xs">${a.detail}</td>`)))}</div>`);
  });
  return w;
}
function getFilteredAudits(){return MOCK.audits.filter(a=>{if(auditFilters.category.size&&!auditFilters.category.has(a.category))return false;if(auditFilters.action.size&&!auditFilters.action.has(a.action))return false;if(auditFilters.actor.size&&!auditFilters.actor.has(a.actor))return false;return true;}).sort((a,b)=>auditSort==='desc'?b.time.localeCompare(a.time):a.time.localeCompare(b.time));}
function onAuditMSFChange(id,cb){const set=id==='msfAuditCat'?auditFilters.category:id==='msfAuditAction'?auditFilters.action:auditFilters.actor;if(cb.checked)set.add(cb.value);else set.delete(cb.value);navigate('audits');}
function clearAuditMSF(id){const set=id==='msfAuditCat'?auditFilters.category:id==='msfAuditAction'?auditFilters.action:auditFilters.actor;set.clear();navigate('audits');}
function toggleAuditSort(){auditSort=auditSort==='desc'?'asc':'desc';navigate('audits');}
function renderSettings(){const w=el('div');w.innerHTML=pageHeader('站台設定','主題、品牌色、語言與站點資訊');w.innerHTML+=`<div class="grid gap-4 lg:grid-cols-2">${card('p-5',`<h3 class="mb-3 text-sm font-semibold">品牌與主題</h3><div class="space-y-3"><div><label class="mb-2 block text-xs font-medium text-muted-foreground">品牌色（tokiwa 常磐深綠）</label><div class="flex gap-2">${[['#1a6e4a','tokiwa'],['#2c5784','ai'],['#ce3a4e','beni'],['#e8a33d','yamabuki'],['#1d8ec3','tsuyukusa']].map(([hex,name],i)=>`<button class="h-8 w-8 rounded-full border-2 ${i===0?'border-surface-900 dark:border-surface-50':'border-transparent'}" style="background:${hex}" title="${name}"></button>`).join('')}</div></div><div class="flex items-center justify-between"><span class="text-sm">深色模式</span><button onclick="toggleDark()" class="flex h-6 w-11 items-center rounded-full bg-surface-200 px-0.5 dark:bg-brand-600"><span class="h-5 w-5 rounded-full bg-white shadow transition-transform dark:translate-x-5"></span></button></div></div>`)}${card('p-5',`<h3 class="mb-3 text-sm font-semibold">站點資訊</h3><div class="space-y-2 text-sm"><div class="flex justify-between"><span class="text-muted-foreground">站點 ID</span><code class="text-xs">influencer-commerce-demo</code></div><div class="flex justify-between"><span class="text-muted-foreground">站點名稱</span><span>網紅分潤後台</span></div><div class="flex justify-between"><span class="text-muted-foreground">預設語言</span><span>zh-TW</span></div><div class="flex justify-between"><span class="text-muted-foreground">貨幣</span><span>NT$ (TWD)</span></div><div class="flex justify-between"><span class="text-muted-foreground">時區</span><span>Asia/Taipei (UTC+8)</span></div></div>`)}</div>`;return w;}

/* ============================================================ 訂單 Drawer ============================================================ */
function openOrderDrawer(id){const o=MOCK.orders.find(x=>x.id===id);if(!o)return;
  // 訂單狀態時間軸 o----o----o----o----o
  const flow=[{key:'pending',label:'待付款',icon:'clock'},{key:'paid',label:'已付款',icon:'credit-card'},{key:'shipped',label:'已出貨',icon:'truck'},{key:'delivered',label:'已送達',icon:'package-check'}];
  const statusOrder=['pending','paid','shipped','delivered'];
  const curIdx=o.status==='cancelled'?-1:statusOrder.indexOf(o.status);
  const timeline=flow.map((s,i)=>{
    const done=i<=curIdx&&curIdx>=0;
    const isCurrent=i===curIdx;
    return `<div class="flex flex-col items-center ${i<flow.length-1?'flex-1':''}">
      <div class="flex items-center w-full">
        <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-[11px] font-bold transition-all ${done?'bg-brand-600 text-white':isCurrent?'bg-brand-100 text-brand-700 ring-2 ring-brand-400 dark:bg-brand-500/20 dark:text-brand-300':'bg-surface-200 text-surface-400 dark:bg-surface-700'}">${done?'<i data-lucide=\"check\" class=\"h-3.5 w-3.5\"></i>':i+1}</div>
        ${i<flow.length-1?`<div class="h-0.5 flex-1 mx-1 ${i<curIdx?'bg-brand-500':'bg-surface-200 dark:bg-surface-700'}"></div>`:''}
      </div>
      <span class="mt-1.5 text-[10px] ${done||isCurrent?'font-medium text-surface-900 dark:text-surface-50':'text-muted-foreground'} ${isCurrent?'text-brand-600 dark:text-brand-400':''}">${s.label}</span>
    </div>`;
  }).join('');
  const itemsHtml=o.items_detail.map(it=>`<div class="flex justify-between gap-2 py-2 text-sm"><span class="flex-1">${it.name} <span class="text-muted-foreground">×${it.qty}</span></span><span class="tabular text-muted-foreground shrink-0">${money(it.price)}</span></div>`).join('');
  openDrawer({title:o.id,subtitle:`${o.customer} · ${o.date}`,bodyHtml:`
    ${o.status==='cancelled'?'<div class="mb-4">'+statusBadge('cancelled')+'</div>':`<div class="mb-4 flex items-center gap-0.5 rounded-lg border border-border bg-surface-50 p-3 dark:bg-surface-100">${timeline}</div>`}
    <div class="mb-4 flex items-center gap-2 text-xs text-muted-foreground">${statusBadge(o.status)}<span>帶貨：${o.influencer}</span></div>
    <h3 class="mb-2 text-xs font-semibold uppercase text-muted-foreground">訂購品項</h3>
    <div class="mb-4 rounded-lg border border-border bg-card divide-y divide-border px-3">${itemsHtml}</div>
    <dl class="space-y-2 text-sm">
      <div class="flex justify-between border-t border-border pt-2.5"><dt class="font-medium">訂單總額</dt><dd class="tabular text-base font-semibold">${money(o.total)}</dd></div>
      <div class="flex justify-between gap-2"><dt class="text-muted-foreground shrink-0">檔期</dt><dd class="text-xs text-right">${o.campaign}</dd></div>
      <div class="flex justify-between gap-2"><dt class="text-muted-foreground shrink-0">配送地址</dt><dd class="text-xs text-right">${o.addr}</dd></div>
      ${o.note?`<div class="flex justify-between gap-2"><dt class="text-muted-foreground shrink-0">備註</dt><dd class="text-xs text-right">${o.note}</dd></div>`:''}
    </dl>`,
  footerHtml:`<div class="flex gap-2">${o.status==='pending'?btn('確認收款','primary','check'):''}${o.status==='paid'?btn('標記已出貨','primary','truck'):''}${btn('列印揀貨單','outline','printer')}</div>`});
}

/* ============================================================ 深色 + 鍵盤 + 啟動 ============================================================ */
function toggleDark(){document.documentElement.classList.toggle('dark');const d=document.documentElement.classList.contains('dark');$('#darkIcon').setAttribute('data-lucide',d?'sun':'moon');refreshIcons();}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openCmdK();}if((e.metaKey||e.ctrlKey)&&e.key==='b'){e.preventDefault();toggleCollapse();}if(e.key==='Escape'){closeCmdK();closeDrawer();}if(e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='SELECT'&&!e.metaKey&&!e.ctrlKey){const n=parseInt(e.key);if(n>=1&&n<=9){const items=VISIBLE_LEAVES.filter(i=>i.render);if(items[n-1])navigate(items[n-1].id);}}});
$('#cmdkTrigger').addEventListener('click',openCmdK);
$('#collapseToggle').addEventListener('click',toggleCollapse);
applySidebarState();renderNav();navigate('dashboard');refreshIcons();
</script>
