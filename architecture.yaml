version: 1
name: ai-site-starter

principles:
  - beginner-single-site
  - static-site-first
  - one-go-backend
  - explicit-dependencies
  - vertical-modules
  - local-first
  - ai-safe-change

enforcement:
  version: 1
  import_rules:
    scan_root: server/internal
    module_root: server/internal/modules
    platform_root: server/internal/platform
    cross_module_imports: deny
    platform_to_modules: deny

runtime:
  site:
    source: site/
    renderer: server/internal/render
    output: dist/
    production: cloudflare-pages
  api:
    source: server/
    production: railway
  database:
    local: sqlite
    production_default: postgres
  identity:
    production_default: supabase-auth
  object_storage:
    production_default: cloudflare-r2
  email:
    production_default: resend

layers:
  bootstrap:
    path: server/internal/bootstrap
    may_depend_on: [modules, platform, auth]
  modules:
  content:
    path: server/internal/modules/content
    owns: [articles]
    purpose: published content and CMS-facing article writes
  contact:
    path: server/internal/modules/contact
    owns: [contact_inquiries]
    purpose: public inquiry submission and notification
  media:
    path: server/internal/modules/media
    owns: [media_objects, media_assets, media_gc_jobs]
    purpose: authenticated R2 upload authorization, post-upload verification registry, and background object cleanup
  commerce:
    path: server/internal/modules/commerce
    owns: [products, product_images, orders, order_items, order_events, returns, members, promos, payment_methods, shipping_methods, restock_idempotency, ecpay_payment_attempts]
    purpose: catalog, orders, fulfillment, returns, promotions, payment/shipping method configuration, hosted-payment attempts, and product image association
  sitecontent:
    path: server/internal/modules/sitecontent
    owns: [site_content]
    purpose: storefront content with draft/published separation, approval, and expiry
  staff:
    path: server/internal/modules/staff
    owns: [staff_members]
    purpose: staff records, role labels, and last-owner protection

# Module isolation is enforced at the import level only. archcheck inspects Go
# imports; it does not inspect SQL. One known write crosses a module boundary
# at the data level without violating the import rule:
#
#   commerce writes media_assets.unassociated_since_unix from
#   server/internal/modules/commerce/store_catalog.go:markMediaAssociationsTx
#   when product images are linked or unlinked. media owns that table.
#
# Recorded so the map is not read as a stronger guarantee than the gate gives.
# A future SQL-write ownership check must use this ownership map plus explicit
# exceptions; it must not infer ownership from stale line numbers.
known_cross_module_data_writes:
  - writer: commerce
    table: media_assets
    owner: media
    location: server/internal/modules/commerce/store_catalog.go:markMediaAssociationsTx
    detected_by: none

tools:
  human_entrypoint: natural-language-via-agent
  deterministic:
    - server/tools/dev
    - server/tools/seed
    - server/tools/migrate
    - server/tools/render
    - server/tools/preview
    - server/tools/publish
    - server/tools/media-gc
    - server/tools/speccheck
    - server/tools/verify
    - server/tools/archcheck
    - server/tools/scopecheck
    - server/tools/migration-parity
    - server/tools/postgres-live-gate
    - server/tools/local-postgres-gate
  optional_context_engine: codegraph
