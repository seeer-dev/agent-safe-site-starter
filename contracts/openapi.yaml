openapi: 3.1.0
info:
  title: AI Site Starter API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Healthy
          content:
            text/plain:
              schema: {type: string}
  /api/articles:
    get:
      operationId: listPublishedArticles
      responses:
        '200':
          description: Published articles
          content:
            application/json:
              schema:
                type: object
                required: [articles]
                properties:
                  articles:
                    type: array
                    items: {$ref: '#/components/schemas/Article'}
  /api/admin/articles:
    post:
      operationId: upsertArticle
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArticleInput'}
      responses:
        '200':
          description: Saved article
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Article'}
        '401': {description: Unauthorized}
        '403': {description: Admin role required}
  /api/contact:
    post:
      operationId: submitContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: {type: string, maxLength: 120}
                email: {type: string, format: email, maxLength: 254}
                message: {type: string, maxLength: 5000}
      responses:
        '201':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
  /api/media/presign:
    post:
      operationId: presignMediaUpload
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type]
              properties:
                filename: {type: string}
                content_type: {type: string}
      responses:
        '200':
          description: Presigned R2 upload request
          content:
            application/json:
              schema:
                type: object
                required: [url, method, key]
                properties:
                  url: {type: string, format: uri}
                  method: {type: string, const: PUT}
                  key: {type: string}
                  headers:
                    type: object
                    additionalProperties: {type: string}
        '503': {description: R2 not configured}
  /api/media/verify:
    post:
      operationId: verifyMediaUpload
      security: [{bearerAuth: []}]
      summary: Post-upload media verification
      description: |
        Validates a server-generated temp upload key by reading the object
        from R2, checking magic bytes, byte-size, image decode, and
        dimensions. On success, copies to a stable verified key under
        verified/product-images/{userID}/{sha256}.{ext}, deletes the temp
        key, and inserts a registry row. The response contains the
        verified key that the client sends in the product create/update
        payload's product_images array.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaVerifyInput'
      responses:
        '200':
          description: Verified media object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedMedia'
        '400':
          description: Validation error (bad bytes, oversize, corrupt, mismatch)
        '401': {description: Unauthorized}
        '403': {description: Forbidden — missing media.upload capability}
        '503':
          description: R2 not configured or verification temporarily unavailable
  # --- Public commerce ---
  /api/products:
    get:
      operationId: listPublishedProducts
      responses:
        '200':
          description: Published products
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
  /api/products/{slug}:
    get:
      operationId: getProductBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product: {$ref: '#/components/schemas/Product'}
        '404': {description: Not found}
  /api/shipping-methods:
    get:
      operationId: listPublicShippingMethods
      responses:
        '200':
          description: Enabled admin-managed shipping methods. Empty configuration is an empty array. Public id is the stable method key. Fees are not included.
          content:
            application/json:
              schema:
                type: object
                required: [shipping_methods]
                properties:
                  shipping_methods:
                    type: array
                    items: {$ref: '#/components/schemas/PublicShippingMethod'}
        '500': {description: Store failure; generic non-leaking error}
  /api/payment-methods:
    get:
      operationId: listPublicPaymentMethods
      responses:
        '200':
          description: Enabled and ready payment methods
          content:
            application/json:
              schema:
                type: object
                required: [payment_methods]
                properties:
                  payment_methods:
                    type: array
                    items: {$ref: '#/components/schemas/PublicPaymentMethod'}
  /api/site-content/published:
    get:
      operationId: listPublishedSiteContent
      responses:
        '200':
          description: Published site content blocks (no governance metadata)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PublicSiteContent'}
  /api/quote:
    post:
      operationId: createQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteInput'}
      responses:
        '200':
          description: Server-authoritative quote
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuoteResult'}
        '400': {description: Invalid items, shipping/payment method, or promo code}
        '503': {description: Shipping configuration or promo validation unavailable}
  /api/orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order: {$ref: '#/components/schemas/Order'}
        '409': {description: Duplicate idempotency key}
        '400': {description: Invalid request body, order data, shipping/payment method, or promo code}
        '503': {description: Shipping configuration or promo validation unavailable}
  /api/orders/{id}:
    get:
      operationId: getOrderForGuest
      summary: Guest order lookup by order ID + opaque access token in X-Order-Access-Token header (PII masked)
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: X-Order-Access-Token
          in: header
          required: true
          schema: {type: string}
          description: Opaque access token generated at order creation. Sent via header (not query string) to avoid logging in URLs, browser history, and Referer headers. Prevents enumeration by order ID alone.
      responses:
        '200':
          description: Order with PII fields masked (phone, email, shipping address). Access token never included.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Missing id or X-Order-Access-Token header}
        '404': {description: Order not found (wrong token returns 404, not 403)}
  /api/orders/mine:
    post:
      operationId: createOrderForMember
      summary: Authenticated member checkout (MemberID derived from principal, not client)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '201':
          description: Created order with MemberID set from the authenticated principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Invalid request body, order data, shipping/payment method, or promo code}
        '401': {description: Unauthorized}
        '403': {description: Member identity required}
        '409': {description: Duplicate idempotency key}
        '503': {description: Shipping configuration or promo validation unavailable}
    get:
      operationId: listMyOrders
      summary: Authenticated member order listing (PII masked)
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Orders belonging to the authenticated member, with PII masked
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: {$ref: '#/components/schemas/Order'}
        '401': {description: Unauthorized}
        '403': {description: Member identity required}
  /api/orders/mine/{id}:
    get:
      operationId: getMyOrder
      summary: Authenticated member single-order lookup (PII masked, cross-user returns 404)
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Order with PII fields masked. Access token never included.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {description: Unauthorized}
        '403': {description: Member identity required}
        '404': {description: Order not found (cross-user returns 404, not 403)}
  # --- Admin auth ---
  /api/admin/me:
    get:
      operationId: adminMe
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current staff principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeResponse'}
        '401': {description: Unauthorized}
  # --- Admin commerce ---
  /api/admin/products:
    get:
      operationId: adminMinimalCartProductsList
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All products
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
    post:
      operationId: adminMinimalCartProductsCreate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '200':
          description: Created product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/admin/products/{id}:
    get:
      operationId: adminMinimalCartProductsGet
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {description: Not found}
    put:
      operationId: adminMinimalCartProductsUpdate
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
    delete:
      operationId: adminMinimalCartProductsDelete
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204': {description: Deleted}
  /api/admin/shipping-methods:
    get:
      operationId: adminMinimalCartShippingMethodsList
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All shipping methods, including disabled rows
          content:
            application/json:
              schema:
                type: object
                required: [shipping_methods]
                properties:
                  shipping_methods:
                    type: array
                    items: {$ref: '#/components/schemas/ShippingMethod'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '500': {description: Store failure; generic non-leaking error}
    post:
      operationId: adminMinimalCartShippingMethodsCreate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShippingMethodInput'}
      responses:
        '201':
          description: Created shipping method
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShippingMethod'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '409': {description: Duplicate method key}
        '500': {description: Store failure; generic non-leaking error}
  /api/admin/shipping-methods/{id}:
    put:
      operationId: adminMinimalCartShippingMethodsUpdate
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShippingMethodUpdateInput'}
      responses:
        '200':
          description: Updated shipping method
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShippingMethod'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Missing row}
        '409': {description: Stale expected_version; row not overwritten}
        '500': {description: Store failure; generic non-leaking error}
  /api/admin/orders:
    get:
      operationId: adminMinimalCartOrdersList
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All orders
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: {$ref: '#/components/schemas/Order'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/admin/orders/{id}:
    get:
      operationId: adminMinimalCartOrdersGet
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '404': {description: Not found}
  /api/admin/orders/{id}/status:
    patch:
      operationId: adminMinimalCartOrdersStatusUpdate
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, new_status]
              properties:
                expected_version: {type: integer, description: 'Aggregate version for optimistic concurrency; stale version returns 409.'}
                new_status: {type: string, enum: [pending, processing, shipped, delivered, cancelled]}
                note: {type: string}
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '409': {description: Stale version or invalid fulfillment-state transition}
  /api/admin/orders/{id}/return:
    patch:
      operationId: adminMinimalCartOrdersReturnStatusUpdate
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, new_status]
              properties:
                expected_version: {type: integer, description: 'Aggregate version for optimistic concurrency; stale version returns 409.'}
                new_status: {type: string, enum: [requested, approved, rejected, received]}
                note: {type: string}
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '409': {description: Stale version or invalid return-state transition}
  /api/admin/orders/{id}/restock:
    post:
      operationId: adminMinimalCartOrdersRestock
      security: [{bearerAuth: []}]
      summary: Per-item restock of received returns. Requires orders.returns AND inventory.adjust capabilities.
      description: >
        Atomically increments returned_quantity and restocked_quantity on
        order_items rows, increments products.stock for the restocked amount,
        increments the order aggregate version (guarded by expected_version),
        and appends an order_event with the actor and reason. The order must
        have return_request_status = "received". The DB CHECK constraint
        enforces 0 <= restocked_quantity <= returned_quantity <= quantity.
        Idempotent: same key + same payload returns the same result; same key
        + different payload returns 409.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, idempotency_key, reason, items]
              properties:
                expected_version: {type: integer, description: 'Aggregate version for optimistic concurrency; stale version returns 409.'}
                idempotency_key: {type: string, description: 'Non-empty. Same key + same payload is a retry; same key + different payload is a 409 conflict.'}
                reason: {type: string, description: 'Required. Recorded in the append-only order_event.'}
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, returned_quantity, restocked_quantity]
                    properties:
                      sku: {type: string}
                      returned_quantity: {type: integer, minimum: 0, description: 'Units physically received back in this action.'}
                      restocked_quantity: {type: integer, minimum: 0, description: 'Units being put back into salable inventory. Must be <= returned_quantity.'}
      responses:
        '200':
          description: Updated order with refreshed item ledger
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Missing reason, missing idempotency key, empty items, over-restock, or SKU not in order}
        '403': {description: Principal lacks orders.returns or inventory.adjust capability}
        '409': {description: Stale version, return not received, or idempotency key reused with different payload}
  # --- Admin staff ---
  /api/admin/staff:
    get:
      operationId: adminStaffMembersList
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All staff members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/StaffMember'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
    post:
      operationId: adminStaffMembersCreate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffMemberInput'}
      responses:
        '200':
          description: Created staff member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '403': {description: Forbidden}
  /api/admin/staff/{id}:
    put:
      operationId: adminStaffMembersUpdate
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffMemberInput'}
      responses:
        '200':
          description: Updated staff member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '403': {description: Forbidden — self-elevation or last-owner}
    delete:
      operationId: adminStaffMembersDelete
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '204': {description: Deleted}
        '403': {description: Forbidden — last-owner protection}
  /api/admin/staff/{id}/status:
    patch:
      operationId: adminStaffMembersStatusUpdate
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [active, disabled]}
      responses:
        '200':
          description: Updated staff member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '403': {description: Forbidden — last-owner protection}
  # --- Admin site content ---
  /api/admin/site-content:
    get:
      operationId: adminMinimalCartContentList
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All site content blocks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SiteContent'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
    post:
      operationId: adminMinimalCartContentCreate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteContentInput'}
      responses:
        '201':
          description: Created site content (always draft)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteContent'}
        '403': {description: Forbidden}
  /api/admin/site-content/{id}:
    put:
      operationId: adminMinimalCartContentUpdate
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteContentUpdateInput'}
      responses:
        '200':
          description: Updated site content (status preserved, never promoted)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteContent'}
        '409': {description: Conflict — stale draft version}
    delete:
      operationId: adminMinimalCartContentDelete
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: deleted}
        '403': {description: Forbidden — content.publish required for published rows, content.update for drafts}
        '404': {description: Site content not found}
  /api/admin/site-content/{id}/approve:
    post:
      operationId: adminMinimalCartContentApprove
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expiry_unix, expected_draft_version]
              properties:
                expiry_unix:
                  type: integer
                  format: int64
                  description: Unix timestamp when the approval expires; must be in the future.
                expected_draft_version:
                  type: integer
                  minimum: 1
                  description: The draft_version the approver saw when loading the row; must match the current draft_version or the request is rejected with 409.
      responses:
        '200':
          description: Approval recorded for the current draft version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteContent'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden — content.approve capability required}
        '404': {description: Site content not found}
        '409': {description: Conflict — stale draft version}
  /api/admin/site-content/{id}/publish:
    post:
      operationId: adminMinimalCartContentPublish
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_draft_version]
              properties:
                expected_draft_version:
                  type: integer
                  minimum: 1
                  description: The draft_version the publisher saw when loading the row; must match the current draft_version or the request is rejected with 409.
      responses:
        '200':
          description: Published site content (approved draft promoted to published snapshot)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteContent'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden — content.publish capability required}
        '404': {description: Site content not found}
        '409': {description: Conflict — stale draft version or no current approval (missing, stale, or expired)}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Article:
      type: object
      required: [id, slug, title, excerpt, body_html, published, updated_unix]
      properties:
        id: {type: string}
        slug: {type: string}
        title: {type: string}
        excerpt: {type: string}
        body_html: {type: string}
        published: {type: boolean}
        updated_unix: {type: integer, format: int64}
    ArticleInput:
      type: object
      required: [slug, title, published]
      properties:
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        title: {type: string, maxLength: 160}
        excerpt: {type: string, maxLength: 500}
        body_html: {type: string}
        published: {type: boolean}
    Product:
      type: object
      required: [id, sku, name, slug, price, stock, status]
      properties:
        id: {type: string}
        sku: {type: string}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        long_description: {type: string}
        image:
          type: string
          description: 'Derived public URL of the first verified product image. Empty if no product_images are associated. NOT an authority — the legacy products.image column is never read for public responses.'
        images:
          type: array
          items: {type: string}
          description: 'Derived public URLs of all verified product images, in sort order. Empty array if no product_images are associated. NOT an authority — the legacy products.images column is never read for public responses.'
        category: {type: string}
        status: {type: string, enum: [active, draft, out_of_stock, low_stock]}
        material: {type: string}
        origin: {type: string}
        price: {type: integer, description: 'TWD cents'}
        original_price: {type: integer}
        stock: {type: integer}
        tag: {type: string}
        rating: {type: number}
        reviews_count: {type: integer}
        updated_unix: {type: integer, format: int64}
    ProductInput:
      type: object
      required: [sku, name, slug, price]
      properties:
        sku: {type: string}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        long_description: {type: string}
        product_images:
          type: array
          items: {$ref: '#/components/schemas/ProductImageInput'}
          description: |
            Verified product image associations. Each key must be a
            verified object key returned by POST /api/media/verify.
            The service validates each key against the media registry
            and rejects unverified keys with 400. AltText defaults to
            the product name if empty. SortOrder is derived from array
            order. Nil preserves existing images; empty clears all.
            The legacy image/images fields are NOT accepted —
            DisallowUnknownFields rejects any payload containing them.
        category: {type: string}
        status: {type: string}
        material: {type: string}
        origin: {type: string}
        price: {type: integer}
        original_price: {type: integer}
        stock: {type: integer}
        tag: {type: string}
    ProductImageInput:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: 'Verified object key from POST /api/media/verify (e.g. verified/product-images/{userID}/{sha256}.{ext})'
        alt_text:
          type: string
          description: 'Alt text for accessibility. Defaults to product name if empty.'
    AdminProductImage:
      type: object
      properties:
        id: {type: string}
        object_key: {type: string}
        alt_text: {type: string}
        sort_order: {type: integer}
        created_unix: {type: integer, format: int64}
      description: |
        Admin-facing product image DTO. Exposes the raw verified
        object key for editing. ONLY output by authorized admin
        endpoints, never by public catalog endpoints.
    AdminProductResponse:
      type: object
      properties:
        id: {type: string}
        sku: {type: string}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        long_description: {type: string}
        category: {type: string}
        status: {type: string}
        material: {type: string}
        origin: {type: string}
        price: {type: integer}
        original_price: {type: integer}
        stock: {type: integer}
        tag: {type: string}
        rating: {type: number}
        reviews_count: {type: integer}
        updated_unix: {type: integer, format: int64}
        product_images:
          type: array
          items: {$ref: '#/components/schemas/AdminProductImage'}
          description: |
            Raw verified object keys for admin editing. The admin form
            uses this field exclusively — the legacy image/images
            fields are NOT present in admin responses. Public Product
            responses derive image/images URLs from this data.
    MediaVerifyInput:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: 'Server-generated temp upload key (uploads/{userID}/product-images/{random}.{ext}). NOT a URL.'
    VerifiedMedia:
      type: object
      required: [key, content_type, bytes, width, height]
      properties:
        key:
          type: string
          description: 'Stable verified object key (verified/product-images/{userID}/{sha256}.{ext}). Send this in product_images[].key.'
        content_type: {type: string}
        bytes: {type: integer, format: int64}
        width: {type: integer}
        height: {type: integer}
    PublicShippingMethod:
      type: object
      required: [id, label, available, description]
      properties:
        id: {type: string, description: Stable method key from the admin-managed row}
        label: {type: string}
        available: {type: boolean, description: Always true for enabled rows returned by this endpoint}
        description: {type: string}
    ShippingMethod:
      type: object
      required: [id, method, label, description, fee, enabled, sort_order, version, updated_unix]
      properties:
        id: {type: string}
        method: {type: string}
        label: {type: string}
        description: {type: string}
        fee: {type: integer, minimum: 0}
        free_threshold: {type: integer, nullable: true, minimum: 1, description: Null means no free-shipping threshold}
        enabled: {type: boolean}
        sort_order: {type: integer, minimum: 0}
        version: {type: integer, minimum: 1}
        updated_unix: {type: integer, format: int64}
    ShippingMethodInput:
      type: object
      required: [method, label, fee, enabled, sort_order]
      additionalProperties: false
      properties:
        method: {type: string, pattern: '^[a-z0-9_-]+$', minLength: 1, maxLength: 64}
        label: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 500}
        fee: {type: integer, minimum: 0}
        free_threshold: {type: integer, nullable: true, minimum: 1}
        enabled: {type: boolean}
        sort_order: {type: integer, minimum: 0}
    ShippingMethodUpdateInput:
      type: object
      required: [label, fee, enabled, sort_order, expected_version]
      additionalProperties: false
      properties:
        method: {type: string, description: Ignored on update; method is immutable}
        label: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 500}
        fee: {type: integer, minimum: 0}
        free_threshold: {type: integer, nullable: true, minimum: 1}
        enabled: {type: boolean}
        sort_order: {type: integer, minimum: 0}
        expected_version: {type: integer, minimum: 1}
    PublicPaymentMethod:
      type: object
      required: [id, method, label, available]
      properties:
        id: {type: string}
        method: {type: string}
        label: {type: string}
        available: {type: boolean}
    PublicSiteContent:
      type: object
      description: Public site content block — only approved published fields. No approval, version, or governance metadata.
      required: [id, key, placement, title, body, status, sort_order]
      properties:
        id: {type: string}
        key: {type: string}
        placement: {type: string, enum: [hero, announcement, popup, footer, policy]}
        title: {type: string}
        body: {type: string}
        status: {type: string, enum: [published]}
        sort_order: {type: integer}
        updated_unix: {type: integer, format: int64}
    SiteContent:
      type: object
      description: Admin site content block — includes draft/approval/published governance fields.
      required: [id, key, placement, title, body, status, sort_order]
      properties:
        id: {type: string}
        key: {type: string}
        placement: {type: string, enum: [hero, announcement, popup, footer, policy]}
        title: {type: string}
        body: {type: string}
        status: {type: string, enum: [draft, published]}
        sort_order: {type: integer}
        updated_unix: {type: integer, format: int64}
        draft_version: {type: integer, description: 'Increments on every material draft edit; invalidates prior approval'}
        approved_version: {type: integer, description: 'The draft_version that the current approval covers; 0/absent means no approval'}
        approver_user_id: {type: string, description: 'The identity that granted the current approval'}
        approved_unix: {type: integer, format: int64, description: 'When the current approval was granted'}
        approved_expiry_unix: {type: integer, format: int64, description: 'When the current approval expires; publish rejects if past'}
        published_title: {type: string, description: 'Admin-only: the currently-live approved title'}
        published_body: {type: string, description: 'Admin-only: the currently-live approved body'}
        published_key: {type: string, description: 'Admin-only: the currently-live approved route key'}
        published_placement: {type: string, description: 'Admin-only: the currently-live approved placement'}
        published_sort_order: {type: integer, description: 'Admin-only: the currently-live approved sort order'}
        published_updated_unix: {type: integer, format: int64, description: 'Admin-only: when the published snapshot was last promoted'}
        published_version: {type: integer, description: 'Admin-only: the draft_version frozen into the published snapshot at publish time'}
        published_approver_user_id: {type: string, description: 'Admin-only: the approver identity frozen into the published snapshot at publish time'}
        published_approved_unix: {type: integer, format: int64, description: 'Admin-only: when the frozen published approval was granted'}
        published_approval_expiry_unix: {type: integer, format: int64, description: 'Admin-only: when the frozen published approval expires; ListPublished/ListByPlacement filter on this > now'}
    SiteContentInput:
      type: object
      description: Create input — no expected_draft_version (new row has no prior version).
      required: [key, placement, title]
      properties:
        key: {type: string}
        placement: {type: string, enum: [hero, announcement, popup, footer, policy]}
        title: {type: string}
        body: {type: string}
        sort_order: {type: integer}
    SiteContentUpdateInput:
      type: object
      description: Update input — requires expected_draft_version for optimistic concurrency.
      required: [key, placement, title, expected_draft_version]
      properties:
        key: {type: string}
        placement: {type: string, enum: [hero, announcement, popup, footer, policy]}
        title: {type: string}
        body: {type: string}
        sort_order: {type: integer}
        expected_draft_version: {type: integer, minimum: 1, description: 'The draft_version the client saw when loading the row; must match or the update is rejected with 409'}
    QuoteInput:
      type: object
      required: [items, shipping_method, payment_method]
      properties:
        items:
          type: array
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: {type: string}
              quantity: {type: integer, minimum: 1}
        shipping_method: {type: string}
        payment_method:
          type: string
          description: |
            Payment method ID or method name. Validated server-side against
            the payment_methods table (enabled=true, readiness_status=ready).
            Empty, unknown, disabled, or not-ready methods return 400.
        promo_code:
          type: string
          description: Empty or a code already validated by the successful quote response.
    QuoteResult:
      type: object
      required: [items, subtotal, discount, shipping, total, shipping_method, payment_method]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        subtotal: {type: integer}
        discount: {type: integer}
        shipping: {type: integer}
        total: {type: integer}
        promo_code:
          type: string
          description: Optional customer-entered code. Validated server-side; unknown, disabled, expired, or not-yet-active codes return 400. Valid codes are not publicly enumerated.
        shipping_method: {type: string}
        payment_method: {type: string}
    OrderInput:
      type: object
      required: [items, customer_name, email, phone, shipping_address, shipping_method, payment_method, idempotency_key]
      properties:
        items:
          type: array
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: {type: string}
              name: {type: string}
              price: {type: integer, description: 'Ignored — server recalculates from catalog'}
              quantity: {type: integer, minimum: 1}
        customer_name: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 254}
        phone: {type: string, maxLength: 30}
        shipping_address: {type: string, maxLength: 500}
        shipping_method: {type: string}
        payment_method:
          type: string
          description: |
            Payment method ID or method name. Validated server-side against
            the payment_methods table (enabled=true, readiness_status=ready).
            Empty, unknown, disabled, or not-ready methods return 400.
            Persisted on the order for fulfillment.
        promo_code:
          type: string
          description: Optional customer-entered code. Validated server-side; unknown, disabled, expired, or not-yet-active codes return 400. Valid codes are not publicly enumerated.
        idempotency_key: {type: string}
      description: |
        Member identity is intentionally absent from OrderInput. For guest
        checkout (POST /api/orders) the MemberID is empty. For member
        checkout (POST /api/orders/mine) the MemberID is derived from the
        authenticated principal at the handler boundary — never from
        client input.
    OrderItem:
      type: object
      required: [sku, name, price, quantity]
      properties:
        sku: {type: string}
        name: {type: string}
        price: {type: integer}
        quantity: {type: integer}
        returned_quantity: {type: integer, description: 'Units confirmed returned. Persisted in order_items ledger; 0 on new orders.'}
        restocked_quantity: {type: integer, description: 'Units restocked into salable inventory. Persisted in order_items ledger; 0 on new orders. Constrained: 0 <= restocked_quantity <= returned_quantity <= quantity.'}
    Order:
      type: object
      required: [id, status, subtotal, discount, shipping, total, items, customer_name, email, phone, shipping_address, shipping_method, payment_method, version, updated_unix]
      properties:
        id: {type: string}
        status: {type: string, enum: [pending, processing, shipped, delivered, cancelled]}
        payment_status: {type: string, enum: [unpaid, paid, refunded]}
        return_request_status: {type: string, enum: ['', requested, approved, rejected, received, refunded]}
        version:
          type: integer
          description: 'Aggregate optimistic-concurrency version. Incremented on every order mutation. Clients send expected_version in transition requests; stale version returns 409.'
        subtotal: {type: integer}
        discount: {type: integer}
        shipping: {type: integer}
        total: {type: integer}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        customer_name: {type: string}
        email: {type: string}
        phone: {type: string}
        shipping_address: {type: string}
        shipping_method: {type: string}
        payment_method:
          type: string
          description: |
            Customer-selected payment method. Validated server-side against
            the payment_methods table (enabled=true, readiness_status=ready)
            before order creation. Persisted for fulfillment.
        promo_code: {type: string}
        idempotency_key: {type: string}
        access_token:
          type: string
          description: |
            Plaintext access token. ONLY present in the create-order
            response (one-time display). Never present in guest lookup,
            member listing, or admin responses. The DB stores only a
            SHA-256 hash; the plaintext is not persisted.
        timeline:
          type: array
          items:
            type: object
            properties:
              at: {type: integer, format: int64}
              status: {type: string}
              note: {type: string}
        updated_unix: {type: integer, format: int64}
    MeResponse:
      type: object
      required: [user_id, role, capabilities]
      properties:
        user_id: {type: string}
        staff_id: {type: string}
        email: {type: string}
        role: {type: string, enum: [admin, owner, manager, readonly, user, disabled]}
        capabilities:
          type: array
          items: {type: string}
    StaffMember:
      type: object
      required: [id, display_name, email, role_label, status]
      properties:
        id: {type: string}
        display_name: {type: string}
        email: {type: string}
        role_label: {type: string, enum: [owner, manager, readonly]}
        supabase_user_id: {type: string}
        status: {type: string, enum: [active, disabled]}
        updated_unix: {type: integer, format: int64}
    StaffMemberInput:
      type: object
      required: [display_name, email, role_label]
      properties:
        display_name: {type: string}
        email: {type: string}
        role_label: {type: string, enum: [owner, manager, readonly]}
        supabase_user_id: {type: string}
