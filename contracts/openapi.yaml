      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffMemberInput'}
      responses:
        '200':
          description: Updated staff member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden or self-role/status change}
