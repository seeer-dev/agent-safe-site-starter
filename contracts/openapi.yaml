                  status: {type: string, const: deleted}
        '400': {description: Invalid operation}
        '401': {description: Unauthorized}
        '403': {description: Forbidden or self-delete}
        '404': {description: Staff member not found}
        '409': {description: Last-owner protection}

  /api/admin/staff/{id}/status:
    patch:
      operationId: adminStaffMembersStatusUpdate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {type: string, enum: [active, disabled]}
      responses:
        '200':
          description: Updated staff member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '400': {description: Invalid status}
        '401': {description: Unauthorized}
        '403': {description: Forbidden or self-role/status change}
        '404': {description: Staff member not found}
        '409': {description: Last-owner protection}

  /api/admin/site-content:
    get:
      operationId: adminMinimalCartContentList
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All site content blocks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SiteContent'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '500': {description: Store failure}
    post:
      operationId: adminMinimalCartContentCreate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteContentInput'}
      responses:
        '201':
          description: Created site content; service keeps it draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteContent'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}

  /api/admin/site-content/{id}:
    put:
      operationId: adminMinimalCartContentUpdate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteContentUpdateInput'}
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteContent'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Site content not found}
        '409': {description: Stale draft version}
    delete:
      operationId: adminMinimalCartContentDelete
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: deleted}
        '400': {description: Invalid operation}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Site content not found}

  /api/admin/site-content/{id}/approve:
    post:
      operationId: adminMinimalCartContentApprove
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteContentApprovalInput'}
      responses:
        '200':
          description: Approval recorded for current draft version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteContent'}
        '400': {description: Invalid expiry or input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Site content not found}
        '409': {description: Stale draft version}

  /api/admin/site-content/{id}/publish:
    post:
      operationId: adminMinimalCartContentPublish
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteContentPublishInput'}
      responses:
        '200':
          description: Approved draft promoted to published snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SiteContent'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Site content not found}
        '409': {description: Stale version or missing/stale/expired approval}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Article:
      type: object
      required: [id, slug, title, excerpt, body_html, published, updated_unix]
      properties:
        id: {type: string}
        slug: {type: string}
        title: {type: string}
        excerpt: {type: string}
        body_html: {type: string}
        published: {type: boolean}
        updated_unix: {type: integer, format: int64}

    ArticleInput:
      type: object
      required: [slug, title, published]
      properties:
        slug: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
        title: {type: string, maxLength: 160}
        excerpt: {type: string, maxLength: 500}
        body_html: {type: string}
        published: {type: boolean}

    PresignedPut:
      type: object
      required: [url, method, key]
      properties:
        url: {type: string, format: uri}
        method: {type: string, const: PUT}
        key: {type: string}
        headers:
          type: object
          additionalProperties: {type: string}

    MediaVerifyInput:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: {type: string}

    VerifiedMedia:
      type: object
      required: [key, content_type, bytes, width, height]
      properties:
        key: {type: string}
        content_type: {type: string}
        bytes: {type: integer, format: int64}
        width: {type: integer}
        height: {type: integer}

    Product:
      type: object
      required: [id, sku, name, slug, description, long_description, image, images, category, status, material, origin, price, original_price, stock, tag, rating, reviews_count, updated_unix]
      properties:
        id: {type: string}
        sku: {type: string}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        long_description: {type: string}
        image: {type: string, description: Derived first verified-image public URL}
        images:
          type: array
          items: {type: string}
          description: Derived verified-image public URLs in sort order
        category: {type: string}
        status: {type: string, enum: [active, draft, out_of_stock, low_stock]}
        material: {type: string}
        origin: {type: string}
        price: {type: integer}
        original_price: {type: integer}
        stock: {type: integer}
        tag: {type: string}
        rating: {type: number}
        reviews_count: {type: integer}
        updated_unix: {type: integer, format: int64}

    ProductInput:
      type: object
      additionalProperties: false
      required: [sku, name, slug, price]
      properties:
        sku: {type: string}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        long_description: {type: string}
        product_images:
          type: array
          items: {$ref: '#/components/schemas/ProductImageInput'}
        category: {type: string}
        status: {type: string, enum: [active, draft, out_of_stock, low_stock]}
        material: {type: string}
        origin: {type: string}
        price: {type: integer, minimum: 0}
        original_price: {type: integer, minimum: 0}
        stock: {type: integer, minimum: 0}
        tag: {type: string}

    OrderItem:
      type: object
      required: [sku, name, price, quantity]
      properties:
        sku: {type: string}
        name: {type: string}
        price: {type: integer}
        quantity: {type: integer, minimum: 1}
        returned_quantity: {type: integer, minimum: 0}
        restocked_quantity: {type: integer, minimum: 0}

    ProductImageInput:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: {type: string}
        alt_text: {type: string}

    AdminProductImage:
      type: object
      required: [id, object_key, alt_text, sort_order, created_unix]
      properties:
        id: {type: string}
        object_key: {type: string}
        alt_text: {type: string}
        sort_order: {type: integer}
        created_unix: {type: integer, format: int64}

    AdminProductResponse:
      type: object
      required: [id, sku, name, slug, description, long_description, category, status, material, origin, price, original_price, stock, tag, rating, reviews_count, updated_unix, product_images]
      properties:
        id: {type: string}
        sku: {type: string}
        name: {type: string}
        slug: {type: string}
        description: {type: string}
        long_description: {type: string}
        category: {type: string}
        status: {type: string}
        material: {type: string}
        origin: {type: string}
        price: {type: integer}
        original_price: {type: integer}
        stock: {type: integer}
        tag: {type: string}
        rating: {type: number}
        reviews_count: {type: integer}
        updated_unix: {type: integer, format: int64}
        product_images:
          type: array
          items: {$ref: '#/components/schemas/AdminProductImage'}

    ProductStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [active, draft, out_of_stock, low_stock]}

    BulkProductUpdateInput:
      type: object
      additionalProperties: false
      required: [ids, payload]
      properties:
        ids:
          type: array
          items: {type: string}
        payload:
          type: object
          additionalProperties: true

    PublicShippingMethod:
      type: object
      required: [id, label, available, description]
      properties:
        id: {type: string}
        label: {type: string}
        available: {type: boolean, const: true}
        description: {type: string}

    ShippingMethod:
      type: object
      required: [id, method, label, description, fee, enabled, sort_order, version, updated_unix]
      properties:
        id: {type: string}
        method: {type: string}
        label: {type: string}
        description: {type: string}
        fee: {type: integer, minimum: 0}
        free_threshold: {type: [integer, 'null'], minimum: 1}
        enabled: {type: boolean}
        sort_order: {type: integer, minimum: 0}
        version: {type: integer, minimum: 1}
        updated_unix: {type: integer, format: int64}

    ShippingMethodInput:
      type: object
      additionalProperties: false
      required: [method, label, fee, enabled, sort_order]
      properties:
        method: {type: string, pattern: '^[a-z0-9_-]+$', minLength: 1, maxLength: 64}
        label: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 500}
        fee: {type: integer, minimum: 0}
        free_threshold: {type: [integer, 'null'], minimum: 1}
        enabled: {type: boolean}
        sort_order: {type: integer, minimum: 0}

    ShippingMethodUpdateInput:
      type: object
      additionalProperties: false
      required: [label, fee, enabled, sort_order, expected_version]
      properties:
        method: {type: string, description: Ignored on update; method is immutable}
        label: {type: string, minLength: 1, maxLength: 80}
        description: {type: string, maxLength: 500}
        fee: {type: integer, minimum: 0}
        free_threshold: {type: [integer, 'null'], minimum: 1}
        enabled: {type: boolean}
        sort_order: {type: integer, minimum: 0}
        expected_version: {type: integer, minimum: 1}

    PublicPaymentMethod:
      type: object
      required: [id, method, label, available]
      properties:
        id: {type: string}
        method: {type: string}
        label: {type: string}
        available: {type: boolean, const: true}

    PaymentMethod:
      type: object
      required: [id, method, provider_label, environment, readiness_status, enabled, updated_unix]
      properties:
        id: {type: string}
        method: {type: string}
        provider_label: {type: string}
        environment: {type: string, enum: [production, sandbox]}
        readiness_status: {type: string, enum: [ready, pending_setup]}
        enabled: {type: boolean}
        updated_unix: {type: integer, format: int64}

    PaymentMethodInput:
      type: object
      additionalProperties: false
      required: [method, provider_label, environment, readiness_status, enabled]
      properties:
        method: {type: string}
        provider_label: {type: string}
        environment: {type: string, enum: [production, sandbox]}
        readiness_status: {type: string, enum: [ready, pending_setup]}
        enabled: {type: boolean}

    Member:
      type: object
      required: [id, email, name, status, tier, tags, notes, total_orders, total_spent, updated_unix]
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        status: {type: string, enum: [active, locked]}
        tier: {type: string, enum: [regular, vip]}
        tags: {type: string}
        notes: {type: string}
        total_orders: {type: integer}
        total_spent: {type: integer}
        updated_unix: {type: integer, format: int64}

    MemberInput:
      type: object
      additionalProperties: false
      required: [email, name, status, tier, tags, notes]
      properties:
        email: {type: string}
        name: {type: string}
        status: {type: string, enum: [active, locked]}
        tier: {type: string, enum: [regular, vip]}
        tags: {type: string}
        notes: {type: string}

    MemberStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [active, locked]}

    Promo:
      type: object
      required: [id, code, label, type, value, enabled, starts_unix, expires_unix, updated_unix]
      properties:
        id: {type: string}
        code: {type: string}
        label: {type: string}
        type: {type: string, enum: [percent, fixed]}
        value: {type: integer, minimum: 0}
        enabled: {type: boolean}
        starts_unix: {type: integer, format: int64}
        expires_unix: {type: integer, format: int64}
        updated_unix: {type: integer, format: int64}

    PromoInput:
      type: object
      additionalProperties: false
      required: [code, label, type, value, enabled, starts_unix, expires_unix]
      properties:
        code: {type: string}
        label: {type: string}
        type: {type: string, enum: [percent, fixed]}
        value: {type: integer, minimum: 0}
        enabled: {type: boolean}
        starts_unix: {type: integer, format: int64}
        expires_unix: {type: integer, format: int64}

    PublicSiteContent:
      type: object
      required: [id, key, placement, title, body, status, sort_order, updated_unix]
      properties:
        id: {type: string}
        key: {type: string}
        placement: {type: string, enum: [hero, announcement, popup, footer, policy]}
        title: {type: string}
        body: {type: string}
        status: {type: string, enum: [published]}
        sort_order: {type: integer}
        updated_unix: {type: integer, format: int64}

    SiteContent:
      type: object
      required: [id, key, placement, title, body, status, sort_order, updated_unix]
      properties:
        id: {type: string}
        key: {type: string}
        placement: {type: string, enum: [hero, announcement, popup, footer, policy]}
        title: {type: string}
        body: {type: string}
        status: {type: string, enum: [draft, published]}
        sort_order: {type: integer}
        updated_unix: {type: integer, format: int64}
        draft_version: {type: integer}
        approved_version: {type: integer}
        approver_user_id: {type: string}
        approved_unix: {type: integer, format: int64}
        approved_expiry_unix: {type: integer, format: int64}
        published_title: {type: string}
        published_body: {type: string}
        published_key: {type: string}
        published_placement: {type: string}
        published_sort_order: {type: integer}
        published_updated_unix: {type: integer, format: int64}
        published_version: {type: integer}
        published_approver_user_id: {type: string}
        published_approved_unix: {type: integer, format: int64}
        published_approval_expiry_unix: {type: integer, format: int64}

    SiteContentInput:
      type: object
      required: [key, placement, title]
      properties:
        key: {type: string}
        placement: {type: string, enum: [hero, announcement, popup, footer, policy]}
        title: {type: string}
        body: {type: string}
        sort_order: {type: integer}

    SiteContentUpdateInput:
      type: object
      required: [key, placement, title, expected_draft_version]
      properties:
        key: {type: string}
        placement: {type: string, enum: [hero, announcement, popup, footer, policy]}
        title: {type: string}
        body: {type: string}
        sort_order: {type: integer}
        expected_draft_version: {type: integer, minimum: 1}

    SiteContentApprovalInput:
      type: object
      additionalProperties: false
      required: [expiry_unix, expected_draft_version]
      properties:
        expiry_unix: {type: integer, format: int64}
        expected_draft_version: {type: integer, minimum: 1}

    SiteContentPublishInput:
      type: object
      additionalProperties: false
      required: [expected_draft_version]
      properties:
        expected_draft_version: {type: integer, minimum: 1}

    QuoteInput:
      type: object
      required: [items, shipping_method, payment_method]
      properties:
        items:
          type: array
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: {type: string}
              quantity: {type: integer, minimum: 1}
        shipping_method: {type: string}
        payment_method: {type: string}
        promo_code: {type: string}

    QuoteResult:
      type: object
      required: [items, subtotal, discount, shipping, total, shipping_method, payment_method]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        subtotal: {type: integer}
        discount: {type: integer}
        shipping: {type: integer}
        total: {type: integer}
        promo_code: {type: string}
        shipping_method: {type: string}
        payment_method: {type: string}

    OrderInput:
      type: object
      required: [items, customer_name, email, phone, shipping_address, shipping_method, payment_method, idempotency_key]
      properties:
        items:
          type: array
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: {type: string}
              name: {type: string, description: Ignored as authority}
              price: {type: integer, description: Ignored; server re-prices from catalog}
              quantity: {type: integer, minimum: 1}
        customer_name: {type: string, maxLength: 100}
        email: {type: string, format: email, maxLength: 254}
        phone: {type: string, maxLength: 30}
        shipping_address: {type: string, maxLength: 500}
        shipping_method: {type: string}
        payment_method: {type: string}
        shipping: {type: integer, description: Ignored as authority}
        discount: {type: integer, description: Ignored as authority}
        promo_code: {type: string}
        idempotency_key: {type: string}

    Order:
      type: object
      required: [id, member_id, customer_name, email, phone, items, shipping_address, shipping_method, payment_method, tracking_number, subtotal, discount, shipping, total, status, payment_status, return_request_status, payment_intent_id, version, updated_unix]
      properties:
        id: {type: string}
        member_id: {type: string}
        customer_name: {type: string}
        email: {type: string}
        phone: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        shipping_address: {type: string}
        shipping_method: {type: string}
        payment_method: {type: string}
        tracking_number: {type: string}
        subtotal: {type: integer}
        discount: {type: integer}
        shipping: {type: integer}
        total: {type: integer}
        status: {type: string, enum: [pending, processing, shipped, delivered, cancelled]}
        payment_status: {type: string, enum: [unpaid, paid, refunded]}
        return_request_status: {type: string, enum: ['', requested, approved, rejected, received, refunded]}
        payment_intent_id: {type: string}
        idempotency_key: {type: string}
        access_token: {type: string, description: Present only in create-order response}
        timeline:
          type: array
          items:
            type: object
            required: [status, at]
            properties:
              status: {type: string}
              at: {type: integer, format: int64}
              note: {type: string}
        expected_status: {type: string}
        version: {type: integer, minimum: 1}
        updated_unix: {type: integer, format: int64}

    OrderStatusInput:
      type: object
      additionalProperties: false
      required: [expected_version, new_status]
      properties:
        expected_version: {type: integer, minimum: 1}
        new_status: {type: string, enum: [pending, processing, shipped, delivered, cancelled]}
        note: {type: string}

    OrderReturnInput:
      type: object
      additionalProperties: false
      required: [expected_version, new_status]
      properties:
        expected_version: {type: integer, minimum: 1}
        new_status: {type: string, enum: [requested, approved, rejected, received]}
        note: {type: string}

    RestockInput:
      type: object
      additionalProperties: false
      required: [expected_version, idempotency_key, reason, items]
      properties:
        expected_version: {type: integer, minimum: 1}
        idempotency_key: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [sku, returned_quantity, restocked_quantity]
            properties:
              sku: {type: string}
              returned_quantity: {type: integer, minimum: 0}
              restocked_quantity: {type: integer, minimum: 0}

    ECPayLaunchForm:
      type: object
      required: [action, fields]
      properties:
        action: {type: string, format: uri}
        fields:
          type: object
          additionalProperties: {type: string}
          description: Signed ECPay AIO form fields; HashKey and HashIV are never exposed.

    ECPayCallbackForm:
      type: object
      required: [CheckMacValue, MerchantID, MerchantTradeNo, TradeAmt, RtnCode, TradeNo]
      additionalProperties: {type: string}
      properties:
        CheckMacValue: {type: string}
        MerchantID: {type: string}
        MerchantTradeNo: {type: string}
        TradeAmt: {type: string}
        RtnCode: {type: string}
        TradeNo: {type: string}
        SimulatePaid: {type: string, enum: ['0', '1']}

    MeResponse:
      type: object
      required: [user_id, staff_id, email, role, capabilities]
      properties:
        user_id: {type: string}
        staff_id: {type: string}
        email: {type: string}
        role: {type: string}
        capabilities:
          type: array
          items: {type: string}

    StaffMember:
      type: object
      required: [id, display_name, email, role_label, supabase_user_id, status, updated_unix]
      properties:
        id: {type: string}
        display_name: {type: string}
        email: {type: string}
        role_label: {type: string, enum: [owner, manager, readonly]}
        supabase_user_id: {type: string}
        status: {type: string, enum: [active, disabled]}
        updated_unix: {type: integer, format: int64}

    StaffMemberInput:
      type: object
      required: [display_name, email, role_label]
      properties:
        display_name: {type: string}
        email: {type: string}
        role_label: {type: string, enum: [owner, manager, readonly]}
        supabase_user_id: {type: string}
        status: {type: string, enum: [active, disabled]}