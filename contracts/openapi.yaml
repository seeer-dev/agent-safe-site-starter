openapi: 3.1.0
info:
  title: AI Site Starter API
  version: 0.3.0
servers:
  - url: http://localhost:8080

paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Healthy
          content:
            text/plain:
              schema: {type: string}

  /api/articles:
    get:
      operationId: listPublishedArticles
      responses:
        '200':
          description: Published articles
          content:
            application/json:
              schema:
                type: object
                required: [articles]
                properties:
                  articles:
                    type: array
                    items: {$ref: '#/components/schemas/Article'}
        '500': {description: Store failure}

  /api/admin/articles:
    post:
      operationId: upsertArticle
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArticleInput'}
      responses:
        '200':
          description: Saved article
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Article'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Admin role required}

  /api/contact:
    post:
      operationId: submitContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, message]
              properties:
                name: {type: string, maxLength: 120}
                email: {type: string, format: email, maxLength: 254}
                message: {type: string, maxLength: 5000}
      responses:
        '201':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean, const: true}
        '400': {description: Invalid inquiry}

  /api/media/presign:
    post:
      operationId: presignMediaUpload
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, content_type, purpose]
              properties:
                filename: {type: string}
                content_type: {type: string, enum: [image/jpeg, image/png, image/gif]}
                purpose: {type: string, enum: [product-image]}
      responses:
        '200':
          description: Presigned R2 upload request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PresignedPut'}
        '400': {description: Invalid filename, content type, extension, or purpose}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '503': {description: R2 not configured}

  /api/media/verify:
    post:
      operationId: verifyMediaUpload
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaVerifyInput'}
      responses:
        '200':
          description: Verified media object
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerifiedMedia'}
        '400': {description: Validation error}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '503': {description: Storage or verification temporarily unavailable}

  /api/products:
    get:
      operationId: listPublishedProducts
      responses:
        '200':
          description: Published products
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: {$ref: '#/components/schemas/Product'}
        '500': {description: Store failure}
        '503': {description: Media public URL is not configured}

  /api/products/{slug}:
    get:
      operationId: getProductBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product: {$ref: '#/components/schemas/Product'}
        '400': {description: Missing slug}
        '404': {description: Product not found}
        '500': {description: Store failure}
        '503': {description: Media public URL is not configured}

  /api/shipping-methods:
    get:
      operationId: listPublicShippingMethods
      responses:
        '200':
          description: Enabled admin-managed shipping methods
          content:
            application/json:
              schema:
                type: object
                required: [shipping_methods]
                properties:
                  shipping_methods:
                    type: array
                    items: {$ref: '#/components/schemas/PublicShippingMethod'}
        '500': {description: Store failure}

  /api/payment-methods:
    get:
      operationId: listPublicPaymentMethods
      responses:
        '200':
          description: Enabled and ready payment methods
          content:
            application/json:
              schema:
                type: object
                required: [payment_methods]
                properties:
                  payment_methods:
                    type: array
                    items: {$ref: '#/components/schemas/PublicPaymentMethod'}
        '500': {description: Store failure}

  /api/site-content/published:
    get:
      operationId: listPublishedSiteContent
      responses:
        '200':
          description: Published site content without governance metadata
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PublicSiteContent'}
        '500': {description: Store failure}

  /api/quote:
    post:
      operationId: createQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteInput'}
      responses:
        '200':
          description: Server-authoritative quote
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuoteResult'}
        '400': {description: Invalid items, shipping/payment method, or promo code}
        '503': {description: Shipping configuration or promo validation unavailable}

  /api/orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '201':
          description: Created guest order
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order: {$ref: '#/components/schemas/Order'}
        '400': {description: Invalid request body, order data, shipping/payment method, promo code, or idempotency key}
        '409': {description: Insufficient stock or idempotency conflict}
        '503': {description: Shipping configuration or promo validation unavailable}

  /api/orders/{id}:
    get:
      operationId: getOrderForGuest
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: X-Order-Access-Token
          in: header
          required: true
          schema: {type: string}
          description: Opaque order credential; kept out of URLs and logs.
      responses:
        '200':
          description: Guest order with PII masked and no access token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Missing order ID or access token}
        '404': {description: Order not found or credential mismatch}
        '500': {description: Store failure}

  /api/orders/mine:
    post:
      operationId: createOrderForMember
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '201':
          description: Created member order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Invalid request body or order data}
        '401': {description: Unauthorized}
        '403': {description: Member identity required or forbidden}
        '409': {description: Insufficient stock or idempotency conflict}
        '503': {description: Shipping configuration or promo validation unavailable}
    get:
      operationId: listMyOrders
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Orders belonging to the authenticated member
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: {$ref: '#/components/schemas/Order'}
        '401': {description: Unauthorized}
        '403': {description: Member identity required}
        '500': {description: Store failure}

  /api/orders/mine/{id}:
    get:
      operationId: getMyOrder
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Member order with PII masked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Missing order ID}
        '401': {description: Unauthorized}
        '403': {description: Member identity required}
        '404': {description: Order not found or belongs to another member}
        '500': {description: Store failure}

  /api/orders/{id}/payments/ecpay:
    post:
      operationId: prepareECPayPayment
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: X-Order-Access-Token
          in: header
          required: true
          schema: {type: string}
          description: Opaque guest-order access credential.
      responses:
        '200':
          description: Server-signed hosted-payment launch form
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ECPayLaunchForm'}
        '400': {description: Missing order credential or wrong payment method}
        '404': {description: Order not found}
        '409': {description: Order already paid or payment attempt conflict}
        '503': {description: ECPay is not configured}
        '500': {description: Failed to prepare payment}

  /api/payments/ecpay/return:
    post:
      operationId: receiveECPayReturn
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/ECPayCallbackForm'}
      responses:
        '200':
          description: Verified callback acknowledged after durable reconciliation
          content:
            text/plain:
              schema: {type: string, const: '1|OK'}
              example: 1|OK
        '400': {description: Invalid signature/form or amount mismatch}
        '404': {description: Durable payment attempt not found}
        '409': {description: Conflicting callback}
        '503': {description: ECPay is not configured}
        '500': {description: Callback processing failure}

  /api/payments/ecpay/browser-return:
    post:
      operationId: ecpayBrowserReturn
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/ECPayCallbackForm'}
      responses:
        '303':
          description: Verified browser return redirects to the storefront; it never mutates payment state
          headers:
            Location:
              description: Storefront return URL
              schema: {type: string, format: uri-reference}
        '400': {description: Invalid browser-return form or signature}

  /api/admin/me:
    get:
      operationId: adminMe
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current principal with server-derived capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeResponse'}
        '401': {description: Unauthorized}

  /api/admin/products:
    get:
      operationId: adminMinimalCartProductsList
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
      responses:
        '200':
          description: All products as admin DTOs
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: {$ref: '#/components/schemas/AdminProductResponse'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '500': {description: Store failure}
    post:
      operationId: adminMinimalCartProductsCreate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '201':
          description: Created product as admin DTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductResponse'
        '400': {description: Invalid product input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '503': {description: Media public URL/configuration unavailable where applicable}
        '500': {description: Internal failure}

  /api/admin/products/{id}:
    get:
      operationId: adminMinimalCartProductsGet
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Product detail as admin DTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductResponse'
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Product not found}
        '500': {description: Store failure}
    put:
      operationId: adminMinimalCartProductsUpdate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '200':
          description: Updated product as admin DTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductResponse'
        '400': {description: Invalid product input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Product not found}
        '500': {description: Internal failure}
    delete:
      operationId: adminMinimalCartProductsDelete
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Deleted product identifier
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Product not found}
        '500': {description: Internal failure}

  /api/admin/products/{id}/status:
    patch:
      operationId: adminMinimalCartProductsUpdateStatus
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductStatusInput'}
      responses:
        '200':
          description: Updated product as admin DTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductResponse'
        '400': {description: Invalid status}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Product not found}
        '500': {description: Internal failure}

  /api/admin/products/bulk:
    post:
      operationId: adminMinimalCartProductsBulkUpdate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkProductUpdateInput'}
      responses:
        '200':
          description: Bulk update count
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: {type: integer, minimum: 0}
        '400': {description: Invalid bulk update}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '500': {description: Internal failure}

  /api/admin/shipping-methods:
    get:
      operationId: adminMinimalCartShippingMethodsList
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: All shipping methods, including disabled rows
          content:
            application/json:
              schema:
                type: object
                required: [shipping_methods]
                properties:
                  shipping_methods:
                    type: array
                    items: {$ref: '#/components/schemas/ShippingMethod'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '500': {description: Store failure}
    post:
      operationId: adminMinimalCartShippingMethodsCreate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShippingMethodInput'}
      responses:
        '201':
          description: Created shipping method
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShippingMethod'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '409': {description: Duplicate method key}
        '500': {description: Store failure}

  /api/admin/shipping-methods/{id}:
    put:
      operationId: adminMinimalCartShippingMethodsUpdate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShippingMethodUpdateInput'}
      responses:
        '200':
          description: Updated shipping method
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShippingMethod'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Method not found}
        '409': {description: Stale expected_version}
        '500': {description: Store failure}

  /api/admin/orders:
    get:
      operationId: adminMinimalCartOrdersList
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: payment_status, in: query, schema: {type: string}}
      responses:
        '200':
          description: All matching orders
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: {$ref: '#/components/schemas/Order'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '500': {description: Store failure}

  /api/admin/orders/{id}:
    get:
      operationId: adminMinimalCartOrdersGet
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Order not found}
        '500': {description: Store failure}

  /api/admin/orders/{id}/status:
    patch:
      operationId: adminMinimalCartOrdersStatusUpdate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderStatusInput'}
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Order not found}
        '409': {description: Stale version or invalid fulfillment transition}
        '500': {description: Internal failure}

  /api/admin/orders/{id}/return:
    patch:
      operationId: adminMinimalCartOrdersReturnStatusUpdate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderReturnInput'}
      responses:
        '200':
          description: Updated order return state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Order not found}
        '409': {description: Stale version or invalid return transition}
        '500': {description: Internal failure}

  /api/admin/orders/{id}/restock:
    post:
      operationId: adminMinimalCartOrdersRestock
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RestockInput'}
      responses:
        '200':
          description: Updated order with refreshed item ledger
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {description: Missing reason/idempotency key, invalid quantities, or SKU not in order}
        '401': {description: Unauthorized}
        '403': {description: Missing returns/inventory capability}
        '404': {description: Order not found}
        '409': {description: Stale version, return not received, or idempotency conflict}
        '500': {description: Internal failure}

  /api/admin/members:
    get:
      operationId: adminMinimalCartMembersList
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: tier, in: query, schema: {type: string}}
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: {$ref: '#/components/schemas/Member'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '500': {description: Store failure}

  /api/admin/members/{id}:
    put:
      operationId: adminMinimalCartMembersUpdate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberInput'}
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {description: Invalid member input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Member not found}
        '500': {description: Internal failure}

  /api/admin/members/{id}/status:
    patch:
      operationId: adminMinimalCartMembersStatusUpdate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberStatusInput'}
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {description: Invalid member status}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Member not found}
        '500': {description: Internal failure}

  /api/admin/promos:
    get:
      operationId: adminMinimalCartPromosList
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Promo definitions
          content:
            application/json:
              schema:
                type: object
                required: [promos]
                properties:
                  promos:
                    type: array
                    items: {$ref: '#/components/schemas/Promo'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '500': {description: Store failure}
    post:
      operationId: adminMinimalCartPromosCreate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoInput'}
      responses:
        '201':
          description: Created promo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Promo'}
        '400': {description: Invalid promo input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '500': {description: Internal failure}

  /api/admin/promos/{id}:
    put:
      operationId: adminMinimalCartPromosUpdate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoInput'}
      responses:
        '200':
          description: Updated promo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Promo'}
        '400': {description: Invalid promo input}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Promo not found}
        '500': {description: Internal failure}
    delete:
      operationId: adminMinimalCartPromosDelete
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Deleted promo identifier
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Promo not found}
        '500': {description: Internal failure}

  /api/admin/payment-methods:
    get:
      operationId: adminTwCommerceMethodsList
