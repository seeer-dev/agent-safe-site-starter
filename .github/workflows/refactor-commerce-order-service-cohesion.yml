name: commerce-order-service-cohesion-refactor

on:
  push:
    branches:
      - refactor/commerce-order-service-cohesion
    paths:
      - .github/refactor-commerce-order-service-cohesion.trigger

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/commerce-order-service-cohesion
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: relocate order service responsibilities
        shell: bash
        run: |
          python3 .github/scripts/refactor-commerce-order-service-cohesion.py
          gofmt -w server/internal/modules/commerce/service*.go
          go test ./server/internal/modules/commerce -run '^$'
          rm .github/refactor-commerce-order-service-cohesion.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/internal/modules/commerce .github/refactor-commerce-order-service-cohesion.trigger
          git commit -m "refactor: split commerce order service by cohesion"
          git push origin HEAD:refactor/commerce-order-service-cohesion
