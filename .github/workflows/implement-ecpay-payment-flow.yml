name: implement-ecpay-payment-flow

on:
  push:
    branches:
      - feat/commerce-ecpay-payment-flow
    paths:
      - .github/implement-ecpay-payment-flow.trigger

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-ecpay-payment-flow
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: |
          python3 .github/scripts/implement_ecpay.py
          python3 .github/scripts/finalize_ecpay_v2.py
      - name: Format Go
        run: gofmt -w server/internal/config/config.go server/internal/bootstrap/app.go server/internal/modules/commerce/service.go server/internal/modules/commerce/store.go server/internal/modules/commerce/ecpay.go server/internal/modules/commerce/ecpay_payment.go server/internal/modules/commerce/store_ecpay.go server/internal/modules/commerce/ecpay_http.go server/internal/modules/commerce/ecpay_test.go server/internal/modules/commerce/ecpay_security_test.go
      - name: Apply postgres migrations
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db?sslmode=disable
        run: go run ./server/tools/migrate
      - name: Verify focused backend
        env:
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db?sslmode=disable
        run: |
          go test ./server/internal/config ./server/internal/bootstrap ./server/internal/modules/commerce
          go run ./server/tools/migration-parity
          SPEC_BASE_REF=8968f4943b6697a70d981ed3e5338d4584518b6f SPEC_REQUIRE_ACCEPTED=1 go run ./server/tools/speccheck
      - name: Verify storefront
        working-directory: site/themes/minimal-cart
        run: |
          npm ci
          npm run build
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: harden ecpay payment flow" || exit 0
          git push origin HEAD:feat/commerce-ecpay-payment-flow
