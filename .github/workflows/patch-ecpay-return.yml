name: patch-ecpay-return

on:
  push:
    branches:
      - feat/commerce-ecpay-payment-flow
    paths:
      - .github/patch-ecpay-return.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-ecpay-payment-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - name: Patch browser return flow
        run: python3 .github/scripts/patch_ecpay_return.py
      - name: Verify storefront
        working-directory: site/themes/minimal-cart
        run: |
          npm ci
          npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/themes/minimal-cart/islands/CheckoutDialog/CheckoutDialog.vue
          git commit -m "feat: resume ecpay payment after browser return"
          git push origin HEAD:feat/commerce-ecpay-payment-flow
