name: commerce-service-cohesion-refactor

on:
  push:
    branches:
      - refactor/commerce-config-service-cohesion
    paths:
      - .github/refactor-commerce-service-cohesion.trigger

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/commerce-config-service-cohesion
          fetch-depth: 0
      - name: relocate commerce configuration service logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('server/internal/modules/commerce')
          service_path = root / 'service.go'
          service = service_path.read_text()

          # Public shipping/payment discovery + payment validation currently sit
          # before the product section. Split them by their actual ownership.
          ship_start = service.index('// PublicShippingMethod is the public-facing shipping method descriptor.')
          pay_start = service.index('// PublicPaymentMethod is the public-facing payment method descriptor.', ship_start)
          products_start = service.index('// ----- Products -------------------------------------------------------------', pay_start)
          shipping_public = service[ship_start:pay_start].rstrip()
          payment_public = service[pay_start:products_start].rstrip()
          service = service[:ship_start] + service[products_start:]

          # Quote/order orchestration uses these helpers, but the rules belong to
          # promotions and shipping configuration respectively.
          discount_start = service.index('// calculateDiscount applies an active promo code to the subtotal.')
          shipping_calc_start = service.index('// computeShipping validates the shipping method against the current', discount_start)
          create_order_start = service.index('// CreateOrder is the public guest checkout entry point.', shipping_calc_start)
          discount_block = service[discount_start:shipping_calc_start].rstrip()
          shipping_calc_block = service[shipping_calc_start:create_order_start].rstrip()
          service = service[:discount_start] + service[create_order_start:]

          # Admin promotion/payment CRUD blocks live near the bottom of the giant
          # service file. Move them without changing a byte of method bodies.
          promos_start = service.index('// ----- Promos ---------------------------------------------------------------')
          payments_start = service.index('// ----- Payment methods ------------------------------------------------------', promos_start)
          helpers_start = service.index('// ----- helpers --------------------------------------------------------------', payments_start)
          promo_admin = service[promos_start:payments_start].rstrip()
          payment_admin = service[payments_start:helpers_start].rstrip()
          service = service[:promos_start] + service[helpers_start:]
          service_path.write_text(service)

          promotions_path = root / 'promotions.go'
          promotions = promotions_path.read_text().rstrip()
          if 'import (' not in promotions:
              promotions = promotions.replace(
                  'package commerce\n',
                  'package commerce\n\nimport (\n\t"context"\n\t"errors"\n\t"fmt"\n\t"strings"\n\t"time"\n\n\t"github.com/example/ai-site-starter/server/internal/auth"\n)\n',
                  1,
              )
          promotions_path.write_text(promotions + '\n\n' + promo_admin + '\n\n' + discount_block + '\n')

          payments_path = root / 'payment_methods.go'
          payments = payments_path.read_text().rstrip()
          if 'import (' not in payments:
              payments = payments.replace(
                  'package commerce\n',
                  'package commerce\n\nimport (\n\t"context"\n\t"fmt"\n\t"strings"\n\t"time"\n\n\t"github.com/example/ai-site-starter/server/internal/auth"\n)\n',
                  1,
              )
          payments_path.write_text(payments + '\n\n' + payment_public + '\n\n' + payment_admin + '\n')

          shipping_path = root / 'shipping_methods.go'
          shipping = shipping_path.read_text().rstrip()
          shipping_path.write_text(shipping + '\n\n' + shipping_public + '\n\n' + shipping_calc_block + '\n')
          PY
          gofmt -w server/internal/modules/commerce/service.go \
            server/internal/modules/commerce/promotions.go \
            server/internal/modules/commerce/payment_methods.go \
            server/internal/modules/commerce/shipping_methods.go
          rm .github/refactor-commerce-service-cohesion.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/internal/modules/commerce .github/refactor-commerce-service-cohesion.trigger
          git commit -m "refactor: colocate commerce configuration service logic"
          git push origin HEAD:refactor/commerce-config-service-cohesion
