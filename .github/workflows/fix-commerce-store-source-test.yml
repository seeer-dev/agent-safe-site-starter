name: fix-commerce-store-source-test

on:
  push:
    branches:
      - refactor/commerce-store-cohesion
    paths:
      - .github/fix-commerce-store-source-test.trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/commerce-store-cohesion
          fetch-depth: 0
      - name: point shipping source test at cohesion file
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/internal/modules/commerce/shipping_methods_test.go')
          s = p.read_text()
          s = s.replace('This inspects store.go source and is not live PostgreSQL evidence.', 'This inspects store_shipping_methods.go source and is not live PostgreSQL evidence.')
          s = s.replace('os.ReadFile("store.go")', 'os.ReadFile("store_shipping_methods.go")')
          s = s.replace('read store.go: %v', 'read store_shipping_methods.go: %v')
          s = s.replace('store.go missing %s', 'store_shipping_methods.go missing %s')
          p.write_text(s)
          PY
          gofmt -w server/internal/modules/commerce/shipping_methods_test.go
          rm .github/fix-commerce-store-source-test.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/internal/modules/commerce/shipping_methods_test.go .github/fix-commerce-store-source-test.trigger
          git commit -m "test: follow shipping store cohesion ownership"
          git push origin HEAD:refactor/commerce-store-cohesion
