name: ecpay-preaccept

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - run: go mod download
      - name: gofmt
        run: test -z "$(gofmt -l server)"
      - name: architecture import check
        run: |
          go test ./server/tools/archcheck -count=1
          go run ./server/tools/archcheck
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
          cache-dependency-path: site/themes/minimal-cart/package-lock.json
      - name: install theme dependencies
        run: npm --prefix site/themes/minimal-cart ci
      - name: build theme bundle
        run: make theme
      - name: frontend contract gate
        run: make verify-contracts
      - name: migration parity check
        run: go run ./server/tools/migration-parity
      - name: apply postgres migrations
        env:
          DB_DRIVER: postgres
          DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/test_db?sslmode=disable'
        run: go run ./server/tools/migrate
      - name: repository tests
        env:
          TEST_DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/test_db?sslmode=disable'
        run: go test ./...
      - name: live postgres integration tests
        env:
          TEST_DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/test_db?sslmode=disable'
        run: go run ./server/tools/postgres-live-gate
      - name: concurrency stress tests
        env:
          TEST_DATABASE_URL: 'postgres://test_user:test_password@localhost:5432/test_db?sslmode=disable'
        run: go test ./server/internal/modules/commerce ./server/internal/modules/staff ./server/internal/modules/media -count=10
      - name: go vet
        run: go vet ./...
