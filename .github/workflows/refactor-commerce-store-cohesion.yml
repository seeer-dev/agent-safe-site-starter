name: commerce-store-cohesion-refactor

on:
  push:
    branches:
      - refactor/commerce-store-cohesion
    paths:
      - .github/refactor-commerce-store-cohesion.trigger

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/commerce-store-cohesion
          fetch-depth: 0
      - name: relocate commerce store sections
        shell: bash
        run: |
          python3 .github/scripts/refactor-commerce-store-cohesion.py
          gofmt -w server/internal/modules/commerce/store*.go
          rm .github/refactor-commerce-store-cohesion.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/internal/modules/commerce .github/refactor-commerce-store-cohesion.trigger
          git commit -m "refactor: split commerce store by cohesion"
          git push origin HEAD:refactor/commerce-store-cohesion
