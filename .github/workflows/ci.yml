name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - run: go mod download
      - name: gofmt
        run: test -z "$(gofmt -l server)"
      - run: go run ./server/tools/archcheck
      - run: go test ./...
      - run: go vet ./...
