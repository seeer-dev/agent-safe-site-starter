name: commerce-service-test-cohesion-refactor

on:
  push:
    branches:
      - refactor/commerce-service-test-cohesion
    paths:
      - .github/refactor-commerce-service-test-cohesion.trigger

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/commerce-service-test-cohesion
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: split commerce service tests by cohesion
        shell: bash
        run: |
          go run .github/scripts/refactor-commerce-service-test-cohesion.go
          gofmt -w server/internal/modules/commerce/service*_test.go
          go test ./server/internal/modules/commerce -run '^$'
          rm .github/refactor-commerce-service-test-cohesion.trigger
          rm .github/scripts/refactor-commerce-service-test-cohesion.go
          rm .github/workflows/refactor-commerce-service-test-cohesion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: split commerce service tests by cohesion"
          git push origin HEAD:refactor/commerce-service-test-cohesion
